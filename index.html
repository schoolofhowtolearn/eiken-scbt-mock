<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英検S-CBT模擬試験（過去問）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout (past-exam edition): CBT terminal — fixed exam header (級・技能・受験者・残り時間・中止), working area, fixed bottom toolbar. */
:root{
  --bg:#e4e8ee; --surface:#ffffff; --sunk:#f2f4f7; --ink:#1a2230; --muted:#5a6476; --line:#c4ccd8; --line2:#9aa6b8;
  --bar:#24466f; --bar2:#1a3554; --bar-ink:#f2f5fa; --tool:#d7dde6; --tool-ink:#1a2230;
  --accent:#d08a1e; --accent-soft:#fcefd6; --rec:#d23b3b; --rec-soft:#fbe3e3;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --ng:#b03a3a; --ng-soft:#f8e2e2; --sel:#1f5aa6; --sel-soft:#e1ebf8;
  --ill-skin:#f2c9a5; --ill-a:#3d7bc4; --ill-b:#d9534f; --ill-green:#6fa35a; --ill-wood:#c99a62; --ill-line:#2b3443; --ill-hair:#3a2e28; --ill-bg:#f8f5ee; --vid:#2f3d4f;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --en:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#18202b; --sunk:#121922; --ink:#e5e9ef; --muted:#9aa5b6; --line:#2e3a4b; --line2:#4a5870;
  --bar:#1b3555; --bar2:#132840; --bar-ink:#e8eef7; --tool:#1f2935; --tool-ink:#e5e9ef;
  --accent:#e6a44a; --accent-soft:#3a2d17; --rec:#ef6b6b; --rec-soft:#3d1c1c;
  --ok:#5cbf85; --ok-soft:#183325; --ng:#e47b7b; --ng-soft:#3a1d1d; --sel:#7fb0ee; --sel-soft:#1b2c44;
  --ill-skin:#e0b48f; --ill-a:#5b93d6; --ill-b:#e06a66; --ill-green:#6f9f5c; --ill-wood:#a87d4c; --ill-line:#cfd7e3; --ill-hair:#6b5242; --ill-bg:#202a37; --vid:#0b1119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#18202b; --sunk:#121922; --ink:#e5e9ef; --muted:#9aa5b6; --line:#2e3a4b; --line2:#4a5870;
  --bar:#1b3555; --bar2:#132840; --bar-ink:#e8eef7; --tool:#1f2935; --tool-ink:#e5e9ef;
  --accent:#e6a44a; --accent-soft:#3a2d17; --rec:#ef6b6b; --rec-soft:#3d1c1c;
  --ok:#5cbf85; --ok-soft:#183325; --ng:#e47b7b; --ng-soft:#3a1d1d; --sel:#7fb0ee; --sel-soft:#1b2c44;
  --ill-skin:#e0b48f; --ill-a:#5b93d6; --ill-b:#e06a66; --ill-green:#6f9f5c; --ill-wood:#a87d4c; --ill-line:#cfd7e3; --ill-hair:#6b5242; --ill-bg:#202a37; --vid:#0b1119; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto}

/* ---------- header ---------- */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;color:var(--bar-ink)}
.bar1{background:var(--bar);padding-block:8px}
.bar1 .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv{font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.45);border-radius:3px;padding:2px 8px;white-space:nowrap}
.sec{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12px;opacity:.8;white-space:nowrap}
.tbox{display:flex;align-items:center;gap:8px;background:var(--bar2);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:3px 10px;min-width:9.5em;justify-content:space-between}
.tbox small{font-size:11px;opacity:.75;white-space:nowrap}
.tbox b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tbox.warn b{color:var(--accent)}
.abort{font:inherit;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--bar-ink);border-radius:3px;padding:4px 12px;cursor:pointer;min-height:34px}
.abort:hover{background:rgba(255,255,255,.12)}
.bar2{background:var(--bar2);padding-block:4px}
.bar2 .in{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.bar2 span{padding:2px 10px;border-radius:2px;opacity:.55}
.bar2 span.on{background:var(--accent);color:#1b1305;opacity:1;font-weight:700}
.bar2 span.done{opacity:.85}
.bar2 span.done::before{content:"✓ "}
.vol{margin-left:auto;display:flex;align-items:center;gap:6px;opacity:.95}
.vol input{width:110px;accent-color:var(--accent)}

main{padding-block:16px 24px}
main.hasfoot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main>.in{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px clamp(16px,3vw,26px)}
h1{font-size:clamp(21px,3.6vw,28px);line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.en{font-family:var(--en);font-size:17px;line-height:1.8}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:3px;cursor:pointer;min-height:44px;box-shadow:0 1px 0 var(--line)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--accent)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn.flag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;padding:8px 12px;border:1px solid var(--line2);border-radius:3px;background:var(--sunk);color:var(--ink);max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scopes .gbtn b{font-size:16px}
.gbtn{font:inherit;text-align:left;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:4px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.gbtn b{font-size:20px;line-height:1.3}
.gbtn span{font-size:12px;color:var(--muted)}
.gbtn:hover{background:var(--sunk)}
.gbtn[aria-checked="true"]{border-color:var(--sel);background:var(--sel-soft);box-shadow:inset 0 0 0 1px var(--sel)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.flow div{padding:12px 14px;border-right:1px solid var(--line);background:var(--sunk);min-width:0}
.flow div:last-child{border-right:0}
.flow b{display:block}
.flow span{font-size:12.5px;color:var(--muted);display:block;line-height:1.55}
.flow i{font-style:normal;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.1em}
@media (max-width:640px){.flow{grid-template-columns:1fr}.flow div{border-right:0;border-bottom:1px solid var(--line)}.flow div:last-child{border-bottom:0}}

/* ---------- question frame ---------- */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:8px 14px}
.qbar b{font-size:15px}
.qbar .qn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qframe{background:var(--surface);border:1px solid var(--line);border-radius:0 0 4px 4px;padding:18px clamp(14px,2.6vw,24px);display:flex;flex-direction:column;gap:14px}
.direc{font-size:14px;background:var(--sunk);border-left:4px solid var(--bar);padding:8px 12px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.split .pane{min-width:0}
@media (min-width:861px){.split .pane.scroll{max-height:calc(100vh - 290px);overflow:auto;padding-right:6px}}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.passage{background:var(--surface);border:1px solid var(--line2);padding:14px 16px}
.passage h4{font-family:var(--en);text-align:center;margin:0 0 6px;font-size:17px}
.mail-h{font-family:var(--en);font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;line-height:1.6}
.qstem{display:flex;gap:10px;align-items:flex-start}
.qstem .no{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--en);font-size:17px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.opt:hover{background:var(--sunk)}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.opt .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent}
.opt .k{flex:none;font-weight:700;width:1.2em;font-variant-numeric:tabular-nums}
.opt .t{font-family:var(--en);font-size:16.5px;min-width:0}
.opt[aria-checked="true"]{border-color:var(--sel);background:var(--sel-soft)}
.opt[aria-checked="true"] .rd{border-color:var(--sel)}
.opt[aria-checked="true"] .rd::after{background:var(--sel)}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts.inline .opt{width:auto;flex:1 1 110px}
.blank{font-family:var(--en);font-weight:700;border-bottom:1.5px solid var(--ink);padding:0 6px}

/* ---------- fixed toolbar ---------- */
footer.tool{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tool);color:var(--tool-ink);border-top:1px solid var(--line2);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
footer.tool .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer.tool .grp{display:flex;gap:8px;flex-wrap:wrap}
footer.tool .msg{font-size:12.5px;color:var(--muted)}

/* ---------- pause / abort dialog ---------- */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(8,14,22,.6);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ovl[hidden],.tbox[hidden]{display:none!important}
.dlg{background:var(--surface);color:var(--ink);border-radius:6px;border:1px solid var(--line);max-width:460px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg .col{display:flex;flex-direction:column;gap:8px}
.dlg .col .btn{width:100%}

/* ---------- overview ---------- */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ov{font:inherit;text-align:left;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:3px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.ov:hover{background:var(--sunk)}
.ov b{font-variant-numeric:tabular-nums}
.ov span{font-size:12px;color:var(--muted)}
.ov.ans{background:var(--sel-soft);border-color:var(--sel)}
.ov .st{font-weight:700;font-size:12px;color:var(--ng)}
.ov.ans .st{color:var(--sel)}
.ov.flg::after{content:"見直し";position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;background:var(--accent);color:#1b1305;padding:0 6px;border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dialog{border:2px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* ---------- speaking ---------- */
.spk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:860px){.spk{grid-template-columns:1fr}}
.video{background:var(--vid);border-radius:4px;overflow:hidden;position:relative;aspect-ratio:4/3;max-width:100%}
.video svg{width:100%;height:100%;display:block}
.video .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-family:var(--en);font-size:15px;padding:8px 12px;line-height:1.5}
.mouth{transform-origin:150px 128px;transform-box:view-box}
.talking .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
.recbox{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;background:var(--sunk)}
.mic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--rec-soft)}100%{box-shadow:0 0 0 12px transparent}}
.recbox .lbl{font-weight:700}
.recbox .lbl.on{color:var(--rec)}
.recbox .cd{margin-left:auto;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-m{height:6px;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar-m i{display:block;height:100%;width:0;background:var(--sel)}
.bar-m.on i{background:var(--rec)}
.qcard{border:2px solid var(--line2);background:var(--surface);padding:16px}
.qcard h3{font-family:var(--en);text-align:center;margin:0 0 6px;font-size:18px}
.qcard .back{display:grid;place-items:center;min-height:200px;color:var(--muted);font-size:14px;text-align:center}
svg.pic{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--ill-bg);margin-top:12px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.pics.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pics figcaption{font-weight:700;font-size:13px;font-family:var(--en)}
.pics svg{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--ill-bg)}
.opening{font-family:var(--en);border:1.5px solid var(--line2);padding:6px 10px;font-size:15px;margin-top:10px;line-height:1.6}
.script{font-family:var(--en);font-size:15px;background:var(--sunk);border:1px dashed var(--line2);padding:8px 12px}

/* ---------- listening ---------- */
.lstage{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:12px 14px;flex-wrap:wrap}
.spk-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.spk-ic.on{border-color:var(--sel);color:var(--sel)}
.spk-ic svg{width:20px;height:20px}
.lstage .lbl{font-weight:700}
.lstage .bar-m{flex:1;min-width:120px}

/* ---------- writing ---------- */
textarea{font-family:var(--en);font-size:16px;line-height:1.7;width:100%;min-height:220px;padding:12px;border:1px solid var(--line2);border-radius:2px;background:var(--surface);color:var(--ink);resize:vertical}
.wc{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wc b{color:var(--ink)}
.u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.points{font-family:var(--en);font-size:15px;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}

/* ---------- results ---------- */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum div{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.sum b.na{font-size:16px;color:var(--muted);padding-top:6px}
.sum span{font-size:12px;color:var(--muted)}
.stopped{display:inline-block;font-size:12px;font-weight:700;color:var(--ng);background:var(--ng-soft);border-radius:3px;padding:1px 8px}
details{border:1px solid var(--line);border-radius:4px;background:var(--surface)}
details>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.rv{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.ng{background:var(--ng-soft);color:var(--ng)}
.model{font-family:var(--en);background:var(--ok-soft);border-radius:3px;padding:8px 12px;font-size:15px}
.mine{font-family:var(--en);background:var(--sunk);border-radius:3px;padding:8px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.selfrate{display:flex;gap:6px;flex-wrap:wrap}
.selfrate button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.selfrate button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.ai{border:1px solid var(--sel);border-radius:4px;padding:12px 14px;background:var(--sel-soft);display:flex;flex-direction:column;gap:8px}
.ai table{border-collapse:collapse;font-size:14px}
.ai td{padding:3px 10px 3px 0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.talking .mouth,.mic.on{animation:none}}

.scopes .gbtn b{font-size:16px}
.cardno{font-size:12px;color:var(--muted);text-align:center;margin-bottom:2px}
.cardimg{width:100%;height:auto;display:block;border:1px solid var(--line);margin-top:12px;background:#fff}
.pics img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.lpic{max-width:min(380px,100%);height:auto;border:1px solid var(--line);background:#fff;display:block}
.pnotes{font-size:13px;color:var(--muted);margin-top:8px}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn.playing{background:var(--sel-soft);border-color:var(--sel)}
.ca{font-weight:700;color:var(--ok)}
.model{white-space:pre-wrap}
@media (min-width:861px){.spk.wide{grid-template-columns:minmax(0,.7fr) minmax(0,1.7fr)}}
.grades{grid-template-columns:repeat(auto-fit,minmax(140px,1fr))!important}
.situ{border:1px solid var(--line2);background:var(--sunk);padding:10px 14px;font-family:var(--en);font-size:15.5px;display:flex;flex-direction:column;gap:6px}
.preview{border-top:1px dashed var(--line);padding-top:8px}
ol.pv{margin:4px 0 0;padding-left:1.6em;font-family:var(--en);font-size:16px;display:flex;flex-direction:column;gap:4px}
small.bp{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-top:4px}
details.inner{margin-top:6px}

.recs details summary{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.verdict{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line);border:1px solid var(--line)}
.verdict>div{background:var(--sunk);padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.verdict span{font-size:12px;color:var(--muted)}.verdict b{font-size:15px}.verdict b.ok{color:var(--ok)}
.skgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.skc{border:1px solid var(--line2);padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.skh{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.skh span{font-size:12px}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.kpi span{display:block;font-size:11.5px;color:var(--muted)}.kpi b{font-size:22px;font-variant-numeric:tabular-nums}
.gauge{position:relative;height:10px;background:var(--sunk);border:1px solid var(--line);border-radius:5px}
.gauge i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--sel)}.gauge i.ok{background:var(--ok)}
.gauge em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);transform:translateX(-1px)}
.judge{margin:0;font-size:13px;font-weight:700}.judge.ok{color:var(--ok)}.judge.ng{color:var(--accent)}
svg.trend{width:100%;height:auto;display:block}
svg.trend .grid{stroke:var(--line);stroke-width:1}svg.trend .ax{fill:var(--muted);font-size:10px}
svg.trend .goal{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3}svg.trend .goalt{fill:var(--ink);font-size:10px;font-weight:700}
svg.trend .ln{fill:none;stroke:var(--sel);stroke-width:2}
svg.trend .dot{fill:var(--sel);stroke:var(--surface);stroke-width:2}svg.trend .dot.ok{fill:var(--ok)}
svg.trend .hit{fill:transparent}svg.trend .pt:hover .dot{r:6}
.seg{display:flex;flex-wrap:wrap;gap:6px}.seg button{min-height:38px;padding:4px 14px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}

.tblwrap{overflow-x:auto}.rtab{border-collapse:collapse;width:100%;font-size:13px;min-width:640px}

.rtab td.low{color:var(--ng);font-weight:700}.rtab tr.avg td{background:var(--sunk);font-weight:700}.rtab.bd{min-width:480px}

.ovc{position:relative;display:flex;flex-direction:column}.ovc .ov{flex:1;padding-bottom:34px}

.ov.mk-rev{box-shadow:inset 4px 0 0 var(--accent)}.ov.mk-uns{box-shadow:inset 4px 0 0 var(--ng)}
.mkb{position:absolute;right:6px;bottom:6px;font:inherit;font-size:12px;font-weight:700;min-height:28px;padding:2px 8px;border:1px dashed var(--line2);background:var(--surface);color:var(--muted);border-radius:3px;cursor:pointer}
.mkb.rev{border:1px solid var(--accent);background:var(--accent);color:#1b1305}.mkb.uns{border:1px solid var(--ng);background:var(--ng-soft);color:var(--ng)}
.btn.flag.uns[aria-pressed="true"]{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.mktag{display:inline-block;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:2px;margin-left:4px}
.mktag.rev{background:var(--accent);color:#1b1305}.mktag.uns{background:var(--ng-soft);color:var(--ng);border:1px solid var(--ng)}
.mkbar{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:13.5px;padding:8px 12px;background:var(--sunk);border:1px solid var(--line)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;cursor:pointer}.chk input{width:18px;height:18px}
.dbody.only>.rv:not([data-mk]){display:none}
.recs .when{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}

<body>
<div class="app">
  <header class="bar">
    <div class="bar1 gut"><div class="in">
      <span class="lv" id="lv">3級</span>
      <span class="sec" id="secname">英検S-CBT 模擬試験（過去問）</span>
      <span class="who" id="who"></span>
      <div class="tbox" id="tbox" hidden><small id="tlabel">残り時間</small><b id="tval">0:00</b></div>
      <button class="abort" id="abortBtn" hidden>中止</button>
    </div></div>
    <div class="bar2 gut"><div class="in" id="rail"></div></div>
  </header>
  <main id="mainwrap" class="gut"><div class="in" id="main"></div></main>
  <footer class="tool gut" id="tool" hidden><div class="in" id="toolin"></div></footer>
  <div class="ovl" id="ovl" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
      <h2 id="dlgT">試験を一時停止しています</h2>
      <p id="dlgP" style="font-size:14px"></p>
      <div class="col">
        <button class="btn primary" id="dResume">再開する</button>
        <button class="btn" id="dResult">中止して、ここまでの結果を見る</button>
        <button class="btn danger" id="dHome">中止してトップに戻る（解答は消えます）</button>
      </div>
    </div>
  </div>
</div>
<script>
/* ===================== 英検S-CBT 模擬試験（過去問・本番音源版） ===================== */
let EX=window.EXAMS||null; // 埋め込みデータ（ローカル版）。公開版はフォルダから読み込む
const ORDER=["3","p2","2","p1"];
const LQ=()=>G().listen.filter(x=>x.kind!=="pas");
const SECS_ALL=[["speak","スピーキング"],["listen","リスニング"],["rw","リーディング・ライティング"]];
const SCOPES=[["all","4技能すべて","本番と同じ流れ"],["speak","スピーキングだけ","面接形式"],["listen","リスニングだけ","本番音源"],["read","リーディングだけ","時間を計って解く"],["write","ライティングだけ","キーボード入力"]];
const S={mk:{},grade:"3",ex:null,scope:"all",mode:"full",screen:"home",sec:null,i:0,run:0,la:{},ra:{},rf:{},wf:{},wa:["",""],done:{},started:{},self:{},rep:{},name:"",vol:1,ov:false,cf:false,ai:null,end:0,paused:false,pauseAt:0,aborted:false,explDone:{}};
const exOf=g=>Object.keys(EX).filter(id=>EX[id].key===g).sort((a,b)=>EX[b].ord-EX[a].ord);
const G=()=>{if(!EX[S.ex]||EX[S.ex].key!==S.grade)S.ex=exOf(S.grade)[0];return EX[S.ex]};
const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wcount=t=>t.trim().split(/\s+/).filter(Boolean).length;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const inS=k=>S.scope==="all"||S.scope===k;
const firstSec=()=>S.scope==="all"?"speak":(S.scope==="read"||S.scope==="write")?"rw":S.scope;
function secs(){
  const all=[["speak","スピーキング"],["listen","リスニング"],["rw",S.scope==="read"?"リーディング":S.scope==="write"?"ライティング":"リーディング・ライティング"]];
  if(S.scope==="all")return all;
  const k=S.scope==="read"||S.scope==="write"?"rw":S.scope;return all.filter(x=>x[0]===k);
}
const limitMin=()=>{const t=G().times;return S.scope==="read"?t.r:S.scope==="write"?t.w:t.rw};
const RW=()=>[...(S.scope!=="write"?G().read.map((_,k)=>({t:"r",k})):[]),...(S.scope!=="read"?G().write.map((_,k)=>({t:"w",k})):[])];

/* ===================== 過去問フォルダの読み込み（公開版） ===================== */
const DATA_NAME="S-CBT模擬試験データ.json";
const nfc=x=>String(x).normalize("NFC"); // iPad・Mac・Google Drive では日本語のファイル名が分解形（NFD）になることがある
const IOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
const base=p=>p.slice(p.lastIndexOf("/")+1);
// mode: url=HTMLと同じ場所 / dir=フォルダ（Chrome・Edge） / list=フォルダを選択（その他） / files=データと音源を1回分ずつ（iPad向け）
const FS={mode:EX?"url":null,root:null,map:null,prefix:"",urls:{},name:"",aud:{},audKeys:new Set()};
async function child(h,name,kind){
  try{return kind==="dir"?await h.getDirectoryHandle(name):await h.getFileHandle(name)}catch(e){
    const want=nfc(name);for await(const [n,c] of h.entries())if(nfc(n)===want&&c.kind===(kind==="dir"?"directory":"file"))return c;throw e}
}
function findInMap(p){
  const m=FS.map,k=nfc(p);if(m.has(k))return m.get(k);
  for(const [key,f] of m)if(key.endsWith("/"+k)||k.endsWith("/"+key))return f; // 1つ上・下の階層を選んだ場合
  return null;
}
async function fileFor(path){
  const p=FS.prefix+path;
  if(FS.mode==="files"){const m=await audOf(G().id);const f=m&&m.get(nfc(base(path)));if(!f)throw new Error("not found");return f}
  if(FS.map){const f=findInMap(p);if(!f)throw new Error("not found");return f}
  let h=FS.root;const seg=p.split("/");
  for(let i=0;i<seg.length-1;i++)h=await child(h,seg[i],"dir");
  return await (await child(h,seg[seg.length-1],"file")).getFile();
}
async function urlFor(f){
  const path=G().base+"/"+f;
  if(FS.mode==="url")return encodeURI(path);
  if(FS.urls[path])return FS.urls[path];
  const u=URL.createObjectURL(await fileFor(path));FS.urls[path]=u;return u;
}
const idb=(op,val)=>new Promise(res=>{try{const r=indexedDB.open("eiken-scbt",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",op==="get"?"readonly":"readwrite");const st=tx.objectStore("kv");
    const q=op==="get"?st.get("dir"):op==="del"?st.delete("dir"):st.put(val,"dir");q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)}catch(e){res(null)}};r.onerror=()=>res(null)}catch(e){res(null)}});
// iPad向け：問題データと音源をこのブラウザに保存しておき、次回は選び直さずに使う
const fdb=(fn,mode="readwrite")=>new Promise(res=>{try{const r=indexedDB.open("eiken-scbt-files",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");
  r.onsuccess=()=>{try{const tx=r.result.transaction("kv",mode);const q=fn(tx.objectStore("kv"));tx.oncomplete=()=>res(q&&"result"in q?q.result:true);tx.onerror=tx.onabort=()=>res(null)}catch(e){res(null)}};
  r.onerror=()=>res(null)}catch(e){res(null)}});
async function audOf(eid){
  if(FS.aud[eid])return FS.aud[eid];
  if(!FS.audKeys.has(eid))return null;
  const o=await fdb(st=>st.get("aud:"+eid),"readonly");if(!o)return null;
  const m=new Map(Object.entries(o));FS.aud[eid]=m;return m;
}
function needFiles(g){const out=new Set();const walk=v=>{if(typeof v==="string"){if(/\.mp3$/i.test(v))out.add(nfc(v))}else if(v&&typeof v==="object")Object.values(v).forEach(walk)};walk(g.speak);walk(g.listen);walk(g.listen_parts);return out}
async function useDataText(t){EX=JSON.parse(t);if(!EX||!Object.keys(EX).length)throw new Error("baddata");FS.mode="files";FS.map=null;FS.root=null;FS.urls={};FS.prefix="";FS.name=""}
async function loadData(readText){
  for(const pre of ["","過去問/"]){
    try{const t=await readText(pre+DATA_NAME);FS.prefix=pre;return JSON.parse(t)}catch(e){}
  }
  throw new Error("nodata");
}
async function useHandle(h){
  FS.root=h;FS.map=null;FS.name=h.name;
  const data=await loadData(async p=>{let d=h;const s=p.split("/");for(let i=0;i<s.length-1;i++)d=await child(d,s[i],"dir");return (await (await child(d,s[s.length-1],"file")).getFile()).text()});
  FS.mode="dir";FS.urls={};EX=data;
}
async function useFileList(files){
  const m=new Map();let top="";
  for(const f of files){const rp=nfc(f.webkitRelativePath||f.name);const i=rp.indexOf("/");if(i<0){m.set(rp,f);continue}top=rp.slice(0,i);m.set(rp.slice(i+1),f)}
  FS.map=m;FS.root=null;FS.name=top;FS.prefix="";
  // データファイルがどの階層にあっても見つける
  let dk=null;for(const k of m.keys())if(base(k)===nfc(DATA_NAME)&&(!dk||k.length<dk.length))dk=k;
  if(!dk)throw new Error(files.length&&![...files].some(f=>f.webkitRelativePath)?"nofolder":"nodata");
  FS.prefix=dk.slice(0,dk.length-base(dk).length);
  EX=JSON.parse(await m.get(dk).text());FS.mode="list";FS.urls={};
}
async function setup(msg){
  $("#secname").textContent="英検S-CBT 模擬試験（過去問）";$("#lv").textContent="英検";$("#rail").innerHTML="";$("#abortBtn").hidden=true;$("#tbox").hidden=true;tool(null);
  const saved=window.showDirectoryPicker?await idb("get"):null;
  const pcWay=`<div class="miccheck"><b>${IOS?"パソコンと同じ方法：":""}「過去問」フォルダをまるごと選ぶ</b>
      <ol style="margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:14px">
        <li>「英検3級」〜「英検準1級」のフォルダと「${DATA_NAME}」が入っている<b>「過去問」フォルダ</b>を選びます。</li>
        <li>「ファイルを表示しますか」「アップロードしますか」と聞かれたら許可してください（この端末の中で読むだけで、送信はしません）。</li>
      </ol>
      ${IOS?`<p class="muted" style="font-size:13px">iPadでは、Google Driveのフォルダをまるごと選ぶと全級の音源とPDF（数百MB）のダウンロードが必要になり、うまくいかないことがあります。その場合は上の方法を使ってください。</p>`:""}
      <div class="row">${saved?`<button class="btn primary" id="reuse">前回のフォルダ（${esc(saved.name)}）を使う</button>`:""}
        <button class="btn ${saved||IOS?"":"primary"}" id="pick">過去問フォルダを選ぶ</button>
        <input type="file" id="dirIn" webkitdirectory directory multiple hidden></div></div>`;
  const padWay=`<div class="miccheck"><b>${IOS?"iPad・Google Driveのときはこちら：":"iPadやスマートフォンの場合："}データと音源を1回分ずつ読み込む</b>
      <ol style="margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:4px;font-size:14px">
        <li>下のボタンで「過去問」フォルダの中にある<b>「${DATA_NAME}」</b>（1ファイル）を選びます。Google Driveの中から選べます。</li>
        <li>次の画面で受ける回を選び、その回の<b>「音源」フォルダ</b>を選びます（1回分 約40MB）。</li>
        <li>読み込んだデータと音源はこのiPadのブラウザに保存されるので、次からは選び直さずに使えます。</li>
      </ol>
      <div class="row"><button class="btn ${IOS?"primary":""}" id="pickData">「${DATA_NAME}」を選ぶ</button><input type="file" id="dataIn" hidden></div></div>`;
  main.innerHTML=`<section class="panel stack">
    <h1>過去問のデータを読み込んでください</h1>
    <p>この模擬試験は、過去問の問題データと音源を、あなたの端末やGoogle Driveにある「過去問」フォルダから読み込みます。問題や音源がインターネットに送られることはありません。</p>
    ${msg?`<p class="note" style="border-color:var(--ng)"><b style="color:var(--ng)">${msg}</b></p>`:""}
    ${IOS?padWay+pcWay:pcWay+padWay}
    <p class="note">パソコンでは Chrome または Edge での利用をおすすめします（2回目からフォルダを覚えておけます）。iPadは Safari で使えます。</p>
  </section>`;
  const fail=e=>{const k=e&&e.message;setup(k==="nodata"?`選んだフォルダに「${DATA_NAME}」が見つかりません。「過去問」フォルダを選んでください。`:k==="nofolder"?"フォルダではなくファイルが選ばれました。このiPadではフォルダごと選べないため、「1回分ずつ読み込む」方法を使ってください。":k==="baddata"||e instanceof SyntaxError?`選んだファイルは「${DATA_NAME}」ではないようです。`:k==="empty"?"ファイルが選ばれませんでした。もう一度選んでください。":"読み込めませんでした。もう一度選んでください。"+(IOS?"Google Driveの場合は、ファイルのダウンロードが終わるまで少し待ってから選び直してください。":""))};
  const ok=()=>{S.screen="home";render()};
  if(saved)$("#reuse").onclick=async()=>{try{if((await saved.requestPermission({mode:"read"}))!=="granted")return setup("フォルダの読み取りが許可されませんでした。");await useHandle(saved);ok()}catch(e){fail(e)}};
  $("#pick").onclick=async()=>{
    if(window.showDirectoryPicker){
      try{const h=await window.showDirectoryPicker({id:"kakomon",mode:"read"});await useHandle(h);idb("put",h);ok()}catch(e){if(e&&e.name==="AbortError")return;fail(e)}
    }else $("#dirIn").click();
  };
  $("#dirIn").onchange=async e=>{const fs=[...e.target.files];e.target.value="";if(!fs.length)return;
    main.querySelector("#pick").textContent="読み込み中…";try{await useFileList(fs);ok()}catch(err){fail(err)}};
  $("#pickData").onclick=()=>$("#dataIn").click();
  $("#dataIn").onchange=async e=>{const f=e.target.files[0];e.target.value="";if(!f)return;
    $("#pickData").textContent="読み込み中…";
    try{const t=await f.text();await useDataText(t);await fdb(st=>st.put(t,"data"));FS.audKeys=new Set(((await fdb(st=>st.getAllKeys(),"readonly"))||[]).filter(k=>String(k).startsWith("aud:")).map(k=>k.slice(4)));ok()}catch(err){fail(err)}};
}
// 1回分の音源を選んで読み込む（iPad向け）
async function pickAudio(files){
  const g=G(),need=needFiles(g),m=new Map(),st=$("#audst");
  for(const f of files){const n=nfc(f.name);if(need.has(n))m.set(n,f)}
  // 別の回のフォルダを選んでいないか（フォルダ名が分かる場合だけ確認）
  const rel=files.map(f=>nfc(f.webkitRelativePath||"")).find(Boolean)||"";const mm=rel.match(/(\d{4}年度 第\d回)/);
  if(mm&&mm[1]!==nfc(g.title))return st.innerHTML=`<b style="color:var(--ng)">選んだのは「${esc(mm[1])}」の音源です。</b>「${esc(g.title)}」の音源フォルダを選んでください。`;
  if(m.size<need.size*0.9)return st.innerHTML=`<b style="color:var(--ng)">この回の音源が見つかりません（${m.size} / ${need.size}ファイル）。</b>「${esc(g.title)}」の中の「音源」フォルダを選んでください。`;
  st.textContent="保存中…";
  const obj={};let n=0;
  for(const [k,f] of m){obj[k]=new Blob([await f.arrayBuffer()],{type:"audio/mpeg"});n++;if(n%5===0)st.textContent=`保存中… ${n} / ${m.size}`}
  FS.aud[g.id]=new Map(Object.entries(obj));FS.urls={};

// 録音は MediaRecorder で行い、このブラウザの IndexedDB に保存する（外部には送らない）
const REC={stream:null,state:"idle",items:{},cur:null,sid:0,ctx:null,an:null,buf:null,KEEP:30};
async function micOn(){
  if(REC.stream&&REC.stream.active)return true;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!window.MediaRecorder){REC.state="unsupported";return false}

    try{REC.ctx=new (window.AudioContext||window.webkitAudioContext)();const src=REC.ctx.createMediaStreamSource(REC.stream);REC.an=REC.ctx.createAnalyser();REC.an.fftSize=512;src.connect(REC.an);REC.buf=new Uint8Array(REC.an.fftSize)}catch(e){REC.an=null}
    return true;
  }catch(e){REC.state=e&&(e.name==="NotAllowedError"||e.name==="SecurityError")?"denied":"nomic";return false}
}
function micOff(){recStop();if(REC.stream){REC.stream.getTracks().forEach(t=>t.stop());REC.stream=null}if(REC.ctx){try{REC.ctx.close()}catch(e){}REC.ctx=null;REC.an=null}if(REC.state==="ok")REC.state="idle"}

function recMime(){if(!window.MediaRecorder)return"";for(const m of["audio/webm;codecs=opus","audio/webm","audio/mp4","audio/ogg;codecs=opus"])try{if(MediaRecorder.isTypeSupported(m))return m}catch(e){}return""}
const recExt=t=>/mp4|aac/.test(t)?"m4a":/ogg/.test(t)?"ogg":"webm";
function recStart(i){
  if(!REC.stream||!REC.stream.active)return;
  const c=REC.cur;
  if(c&&c.i===i){if(c.mr.state==="paused"){c.mr.resume();c.t0=Date.now()}return}
  recStop();
  let mr;try{const m=recMime();mr=new MediaRecorder(REC.stream,m?{mimeType:m}:undefined)}catch(e){return}
  const cur={i,mr,chunks:[],ms:0,t0:Date.now()};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)cur.chunks.push(e.data)};
  mr.onstop=()=>{const blob=new Blob(cur.chunks,{type:mr.mimeType||cur.chunks[0]?.type||"audio/webm"});if(!blob.size)return;
    const old=REC.items[i];if(old&&old.url)URL.revokeObjectURL(old.url);
    REC.items[i]={blob,url:URL.createObjectURL(blob),secs:Math.max(1,Math.round(cur.ms/1000))};recSave();
    if(S.screen==="result"){const box=document.querySelector(`.myrec[data-step="${i}"]`);if(box){box.outerHTML=myRecHTML(i);wireAudios(main)}}};
  try{mr.start(1000)}catch(e){return}

}
function recPause(){const c=REC.cur;if(c&&c.mr.state==="recording"){try{c.mr.pause()}catch(e){}c.ms+=Date.now()-c.t0}}
function recStop(){const c=REC.cur;if(!c)return;REC.cur=null;if(c.mr.state==="recording")c.ms+=Date.now()-c.t0;if(c.mr.state!=="inactive")try{c.mr.stop()}catch(e){}}

const recDB=(fn)=>new Promise(res=>{try{const r=indexedDB.open("eiken-scbt-rec",1);
  r.onupgradeneeded=()=>r.result.createObjectStore("sessions",{keyPath:"id"});
  r.onsuccess=()=>{try{const tx=r.result.transaction("sessions","readwrite");const out=fn(tx.objectStore("sessions"));tx.oncomplete=()=>res(out&&out.result!==undefined?out.result:true);tx.onerror=()=>res(null)}catch(e){res(null)}};

  recDB(st=>st.put(rec)).then(()=>recDB(st=>st.getAllKeys())).then(keys=>{
    if(Array.isArray(keys)&&keys.length>REC.KEEP){const old=keys.sort((a,b)=>a-b).slice(0,keys.length-REC.KEEP);recDB(st=>old.forEach(k=>st.delete(k)))}});

    const show=()=>{msg.innerHTML=REC.state==="ok"?"マイクを使えます。何か話して、緑のバーが動くか確かめてください。":REC.state==="denied"?`<b style="color:var(--ng)">マイクの使用が許可されていません。</b>アドレスバーの鍵（またはカメラ）マークからマイクを「許可」にすると録音できます。このまま録音なしで受験することもできます。`:REC.state==="nomic"?`<b style="color:var(--ng)">マイクが見つかりません。</b>マイクをつないでからもう一度押してください。`:REC.state==="unsupported"?"このブラウザは録音に対応していません。録音なしで受験できます。":""};
    const loop=()=>{if(run!==S.run||S.screen!=="intro")return;bar.style.width=(micLevel()*100).toFixed(0)+"%";requestAnimationFrame(loop)};
    $("#micbtn").onclick=async()=>{await micOn();show();if(REC.state==="ok")requestAnimationFrame(loop)};
    if(REC.stream&&REC.stream.active){show();requestAnimationFrame(loop)}}
  $("#go").onclick=async()=>{if(S.sec==="rw"){S.end=Date.now()+limitMin()*60000;S.elapsed=0}if(S.sec==="speak")await micOn();go(S.sec,{i:0})};
  $("#go").focus();
}

/* ===================== スピーキング ===================== */
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function interviewer(){return `<svg viewBox="0 0 300 225" aria-hidden="true"><rect width="300" height="225" fill="#d9dee6"/><rect y="150" width="300" height="75" fill="#b9a68a"/><rect x="30" y="30" width="70" height="90" fill="#c9d3df" stroke="#aab4c2"/><path d="M95 225 q0 -62 55 -66 q55 4 55 66z" fill="#34495e"/><path d="M136 160 l14 22 l14 -22z" fill="#f4f4f4"/><rect x="140" y="140" width="20" height="22" fill="#e8bf9c"/><ellipse cx="150" cy="112" rx="30" ry="36" fill="#f0c9a6"/><path d="M120 108 q2 -42 30 -42 q30 0 30 42 q-4 -24 -30 -26 q-24 2 -30 26z" fill="#3a2e28"/><circle cx="139" cy="110" r="3" fill="#2b2b2b"/><circle cx="161" cy="110" r="3" fill="#2b2b2b"/><ellipse class="mouth" cx="150" cy="129" rx="7.5" ry="1.2" fill="#7a2f2a"/><rect x="200" y="182" width="60" height="6" fill="#8d7a60"/></svg>`}
/* S-CBTの準備時間・解答時間（秒）。ステップ0＝黙読・音読、1〜＝No.1〜。
   出典：モチタン英語辞典（英検準2級・2級のS-CBTスピーキング解説）。記載のない級は過去問集の音源の時間のまま */
/* S-CBTの準備時間・解答時間（秒）。ステップ0＝黙読・音読（ナレーション）、1〜＝No.1〜。
   null は過去問集の音源の時間のまま。どの級もNo.3〜5の解答時間は60秒 */
const SPK_TIME={
  "3":[null,null,null,[["rec",60]],[["rec",60]],[["rec",null],["rec",60]]],
  p2:[[["prep",20],["rec",60]],[["rec",40]],[["prep",20],["rec",30]],[["prep",20],["rec",60]],[["rec",60]],[["rec",60]]],
  "2":[[["prep",20],["rec",60]],[["rec",40]],[["prep",20],["rec",60]],[["prep",10],["rec",60]],[["prep",10],["rec",60]]],
  p1:[null,null,null,[["rec",60]],[["rec",60]]],
};
function speakPlan(st){
  const all=SPK_TIME[G().key],cfg=all&&all[st.qk==null?0:st.qk+1],aph=st.ph||[];
  if(!cfg||!aph.length)return{timed:false,list:[]};
  let ci=0;const list=[];
  for(const p of aph){const segs=[];while(ci<cfg.length){const [m,s]=cfg[ci++];segs.push({m,s});if(m===p[2])break}
    if(!segs.length)segs.push({m:p[2],s:null});
    segs.forEach(x=>{if(x.s==null)x.s=+(p[1]-p[0]).toFixed(1)});
    list.push({at:p[0],end:p[1],segs})}
  if(ci<cfg.length)list[list.length-1].segs.push(...cfg.slice(ci).map(([m,s])=>({m,s:s==null?20:s})));
  return{timed:true,list};
}
function steps(){const sp=G().speak;return[{lab:sp.stepLabel||"黙読・音読",f:sp.instruct,card:"front",ph:sp.instructPh},...sp.qs.map((q,k)=>({lab:`No. ${q.n}`,f:q.f,card:q.card,ph:q.ph,qk:k,follow:q.follow}))]}
function cardHTML(kind){
  const sp=G().speak;
  if(kind==="back")return `<div class="qcard"><div class="back">（問題カードは裏返しです）<br>あなた自身の考えを答えてください</div></div>`;
  const pics=sp.imgs.length>1?`<div class="pics">${sp.imgs.map(([l,s])=>`<figure><figcaption>${l}</figcaption><img src="${s}" alt="イラスト${l}"></figure>`).join("")}</div>`:`<img class="cardimg" src="${sp.imgs[0][1]}" alt="問題カードのイラスト">`;
  if(!sp.passage)return `<div class="qcard"><div class="cardno">問題カード${sp.card}</div><p class="en" style="font-size:15.5px">${sp.cardText}</p>${pics}</div>`;
  return `<div class="qcard"><div class="cardno">問題カード${sp.card}</div><h3>${sp.title}</h3><p class="en">${sp.passage}</p>${sp.opening?`<div class="opening">Your story should begin with this sentence: <b>${sp.opening}</b></div>`:""}${pics}</div>`;
}
function speak(){
  const SS=steps(),st=SS[S.i],run=++S.run;head(null);
  main.innerHTML=`<div><div class="qbar"><b id="slab">${st.lab}</b><span class="qn">${S.i+1} / ${SS.length}</span></div>
    <div class="qframe"><div class="spk ${G().speak.passage?"":"wide"}">
      <div class="stack" style="gap:10px">
        <div class="video" id="vid">${interviewer()}</div>
        <div class="recbox"><div class="mic" id="mic">${MIC}</div><div><div class="lbl" id="lbl">待機中</div><div class="muted" style="font-size:12px" id="sub">面接委員の話を聞いてください</div></div><div class="cd" id="cd"></div></div>
        <div class="bar-m" id="bm"><i id="bmi"></i></div>
        <p class="note" id="err" hidden></p>
      </div>
      <div>${cardHTML(st.card)}</div>
    </div></div></div>`;
  const repN=S.rep[S.i]||0;
  tool(`<span class="msg">${REC.stream&&REC.stream.active?"赤いマイクの間、あなたの声を録音します":"録音なし（マイクが使えません）"}</span><div class="grp">${st.qk!=null?`<button class="btn warn" id="rep">もう一度聞く${repN?`（${repN}回使用）`:""}</button>`:""}<button class="btn primary" id="nx" disabled>次へ</button></div>`);
  const mic=$("#mic"),lb=$("#lbl"),sub=$("#sub"),cd=$("#cd"),bm=$("#bm"),bmi=$("#bmi"),vid=$("#vid"),nx=$("#nx"),slab=$("#slab");
  const next=()=>{if(run!==S.run)return;stopAudio();if(S.i<SS.length-1)go("speak",{i:S.i+1});else{S.done.speak=true;S.scope==="all"?go("intro",{sec:"listen"}):go("result")}};
  nx.onclick=next;
  if($("#rep"))$("#rep").onclick=()=>{S.rep[S.i]=(S.rep[S.i]||0)+1;go("speak",{i:S.i})};
  let last="";
  const setMode=mode=>{
    if(mode===last)return;last=mode;
    mic.classList.toggle("on",mode==="rec");bm.classList.toggle("on",mode==="rec");lb.classList.toggle("on",mode==="rec");
    lb.textContent=mode==="rec"?"録音中":mode==="prep"?"準備時間":"再生中";
    sub.textContent=mode==="rec"?(st.qk==null?(G().speak.passage?"パッセージを音読してください":"ナレーションをしてください"):"英語で答えてください"):mode==="prep"?(st.qk==null?(G().speak.passage?"パッセージを黙読してください":"イラストを見て準備してください"):"カードを見て準備してください"):"面接委員の話を聞いてください";
    const LB=G().speak.labels||["黙読","音読"];
    if(st.qk==null)slab.textContent=mode==="rec"?LB[1]:mode==="prep"?LB[0]:(G().speak.stepLabel||"黙読・音読");
    nx.disabled=mode!=="rec";if(mode==="talk"){cd.textContent="";bmi.style.width="0%";head(null)}
    if(mode==="rec")recStart(S.i);else recPause();
  };
  const show=(mode,left,frac)=>{cd.textContent=left;bmi.style.width=(frac*100)+"%";head(left,mode==="rec"?"解答時間":"準備時間")};
  // 準備・解答時間：S-CBTの秒数（SPK_TIME）がある級はアプリのタイマーで計り、その間は音源を止める
  const PL=speakPlan(st);let pi=0,busy=false;
  const runSegs=(ph)=>{
    busy=true;try{AU.pause()}catch(e){}
    let k=0;
    const seg=()=>{
      if(run!==S.run)return;
      if(k>=ph.segs.length){busy=false;setMode("talk");try{AU.currentTime=ph.end}catch(e){}const q=AU.play();if(q&&q.catch)q.catch(()=>{});return}
      const sg=ph.segs[k++],end=Date.now()+sg.s*1000;setMode(sg.m);
      const iv=setInterval(()=>{if(run!==S.run){clearInterval(iv);return}
        const ms=end-Date.now();show(sg.m,Math.max(0,Math.ceil(ms/1000)),1-Math.max(0,ms)/(sg.s*1000));
        if(ms<=0){clearInterval(iv);seg()}},150);
      SEG.push(iv);
    };
    seg();
  };
  const onTime=t=>{
    if(run!==S.run||busy)return;
    if(PL.timed){if(pi<PL.list.length&&t>=PL.list[pi].at)runSegs(PL.list[pi++]);return}
    const p=st.ph.find(x=>t>=x[0]&&t<x[1]);const mode=p?p[2]:"talk";
    setMode(mode);
    if(p){const left=Math.max(0,Math.ceil(p[1]-t)),tot=p[1]-p[0];show(mode,left,(t-p[0])/tot)}
  };
  // 口の動き：音源の音量（20コマ/秒）に合わせて開閉する
  const env=G().speak.env[st.f]||"",mouth=vid.querySelector(".mouth");let cur=0;
  const lip=()=>{if(run!==S.run)return;
    let target=0;
    if(!AU.paused&&env){const i=Math.floor((AU.currentTime+0.03)*20);target=+(env[i]||0)}
    cur+= (target-cur)*(target>cur?0.6:0.35);
    mouth.setAttribute("ry",(1.2+cur*0.6).toFixed(2));mouth.setAttribute("rx",(7.5-cur*0.15).toFixed(2));
    if(REC.cur&&REC.cur.mr.state==="recording"){const lv=micLevel();mic.style.boxShadow=`0 0 0 ${(2+lv*12).toFixed(1)}px rgba(200,40,40,${(0.15+lv*0.3).toFixed(2)})`}else if(mic.style.boxShadow)mic.style.boxShadow="";
    requestAnimationFrame(lip)};
  requestAnimationFrame(lip);
  setTimeout(()=>{if(run!==S.run)return;play(st.f,{onTime,onEnd:next,onErr:(why)=>{const e=$("#err");e.hidden=false;e.innerHTML=why==="blocked"?"音声の再生がブラウザに止められました。画面のどこかをクリックしてから「もう一度聞く」を押してください。":"音源ファイルを読み込めませんでした。「次へ」で先に進めます。";nx.disabled=false}})},300);
}

/* ===================== リスニング ===================== */
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
function listen(){
  const L=G().listen,it=L[S.i],run=++S.run;head(null);
  const pt=G().listen_parts[it.part];
  const errFn=why=>{const e=$("#err");if(e){e.hidden=false;e.innerHTML=why==="blocked"?"音声の再生がブラウザに止められました。画面をクリックしてからもう一度お試しください。":"音源ファイルを読み込めませんでした。「次へ」で先に進めます。"}const n=$("#nx");if(n)n.disabled=false};
  // 各部の最初：説明音声
  const firstOfPart=L.findIndex(x=>x.part===it.part)===S.i;
  if(firstOfPart&&!S.explDone[it.part]){
    main.innerHTML=`<div><div class="qbar"><b>第${it.part}部</b><span class="qn">説明</span></div><div class="qframe">
      <p class="direc">${pt.dir}</p>
      <div class="lstage"><div class="spk-ic on">${SPK}</div><span class="lbl">説明の放送中</span><div class="bar-m"><i id="bmi"></i></div></div>

    setTimeout(()=>{if(run!==S.run)return;play(pt.expl,{onTime:t=>{const b=$("#bmi");if(b&&AU.duration)b.style.width=(t/AU.duration*100)+"%"},onEnd:done,onErr:errFn})},300);
    return;
  }
  const total=LQ().length,no=it.no;
  const next=()=>{if(run!==S.run)return;stopAudio();if(S.i<L.length-1)go("listen",{i:S.i+1});else{S.done.listen=true;S.scope==="all"?go("intro",{sec:"rw"}):go("result")}};
  // 第2部（準1級）：英文だけを聞く画面。続く2問の選択肢を表示

      <div class="qframe"><p class="direc">${pt.dir}</p>
      <div class="lstage"><div class="spk-ic on" id="ic">${SPK}</div><span class="lbl" id="lbl">英文を放送中</span><div class="bar-m"><i id="bmi"></i></div></div>
      <p class="note" id="err" hidden></p>
      ${qs.map(q=>`<div class="preview"><div class="qstem"><span class="no">No. ${q.no}</span></div><ol class="pv">${q.opts.map(o=>`<li>${esc(o)}</li>`).join("")}</ol></div>`).join("")}
      </div></div>`;
    tool(`<span class="msg">英文のあとに質問が流れます。前の問題には戻れません。</span><div class="grp"><button class="btn primary" id="nx" disabled>次へ</button></div>`);
    $("#nx").onclick=next;
    setTimeout(()=>{if(run!==S.run)return;play(it.f,{onEnd:next,onErr:errFn,onTime:t=>{const b=$("#bmi");if(b&&AU.duration)b.style.width=(t/AU.duration*100)+"%"}})},300);
    return;
  }
  const sel=S.la[S.i];
  main.innerHTML=`<div><div class="qbar"><b>第${it.part}部${it.label?` (${it.label})`:""}</b><span class="qn">No. ${no}　（${no} / ${total}）</span></div>
    <div class="qframe">
      <p class="direc">${pt.dir}</p>
      <div class="lstage"><div class="spk-ic" id="ic">${SPK}</div><span class="lbl" id="lbl">放送を待っています</span><div class="bar-m"><i id="bmi"></i></div></div>
      <p class="note" id="err" hidden></p>

      <div class="qstem"><span class="no">No. ${no}</span>${it.read?`<span class="muted" style="font-size:14px;line-height:1.8">選択肢は放送されます。</span>`:""}</div>
      <div class="opts ${it.read?"inline":""}" role="radiogroup" aria-label="解答">
        ${(it.read?Array.from({length:it.n},(_,k)=>null):it.opts).map((o,k)=>`<button class="opt" role="radio" aria-checked="${sel===k}" data-k="${k}"><span class="rd"></span><span class="k">${k+1}</span>${o==null?"":`<span class="t">${esc(o)}</span>`}</button>`).join("")}
      </div>
    </div></div>`;
  const lk="l"+S.i;
  tool(`<span class="msg">解答時間が終わると自動で次の問題に進みます。前の問題には戻れません。</span><div class="grp"><button class="btn flag uns" id="lmk" aria-pressed="${S.mk[lk]==="uns"}">？ 自信なし</button><button class="btn primary" id="nx" disabled>次へ</button></div>`);
  $("#lmk").onclick=()=>{setMk(lk,"uns");$("#lmk").setAttribute("aria-pressed",S.mk[lk]==="uns")};
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.la[S.i]=+b.dataset.k;main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b))});
  $("#nx").onclick=next;
  const ic=$("#ic"),lb=$("#lbl"),bmi=$("#bmi");let last="";
  setTimeout(()=>{if(run!==S.run)return;play(it.f,{onEnd:next,onErr:errFn,onTime:t=>{
    if(run!==S.run)return;
    const pre=it.pre&&t>=it.pre[0]&&t<it.pre[1];const ans=t>=it.a0&&t<it.a1;

/* ===================== リーディング・ライティング ===================== */
function answered(n){const x=RW()[n];return x.t==="r"?S.ra[x.k]!=null:wcount(S.wa[x.k])>0}
// 印：rev＝見直し、uns＝自信なし。キーは r3（リーディング）、w0（ライティング）、l5（リスニング）
const MK={rev:["⚑","見直し"],uns:["？","自信なし"]};
const mkKey=n=>{const x=RW()[n];return x.t+x.k};
function flagged(n){return S.mk[mkKey(n)]==="rev"}
const mkOf=n=>S.mk[mkKey(n)]||"";
function setMk(key,v){if(!v||S.mk[key]===v)delete S.mk[key];else S.mk[key]=v}
const mkTag=key=>S.mk[key]?`<span class="mktag ${S.mk[key]}">${MK[S.mk[key]][0]} ${MK[S.mk[key]][1]}</span>`:"";

  tool(`<div class="grp"><button class="btn" id="ovb">問題一覧</button><button class="btn flag" data-m="rev" aria-pressed="${mkOf(S.i)==="rev"}">⚑ 見直し</button><button class="btn flag uns" data-m="uns" aria-pressed="${mkOf(S.i)==="uns"}">？ 自信なし</button></div>
    <div class="grp"><button class="btn" id="pv" ${S.i===0?"disabled":""}>前へ</button><button class="btn primary" id="nx">${S.i<R.length-1?"次へ":"問題一覧へ"}</button></div>`);

function passageHTML(key){

const qno=k=>`(${k+1})`;
function readQ(k){
  const it=G().read[k];

  const opts=`<div class="opts" role="radiogroup" aria-label="${qno(k)}の解答">${it.o.map((o,j)=>`<button class="opt" role="radio" aria-checked="${S.ra[k]===j}" data-k="${j}"><span class="rd"></span><span class="k">${j+1}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>`;
  main.innerHTML=`<div><div class="qbar"><b>リーディング　大問${it.p}</b><span class="qn">${qno(k)}　問題 ${S.i+1} / ${RW().length}</span></div>

  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ra[k]=+b.dataset.k;main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b))});
}
function writeQ(k){

function overview(){
  const R=RW(),un=R.filter((_,n)=>!answered(n)).length,fl=R.filter((_,n)=>mkOf(n)==="rev").length,us=R.filter((_,n)=>mkOf(n)==="uns").length;
  const only=!!S.ovOnly;
  const card=n=>{const x=R[n];const lab=x.t==="r"?`大問${G().read[x.k].p}`:`ライティング ${G().write[x.k].label}`;const m=mkOf(n);
    if(only&&!m)return"";
    return `<div class="ovc"><button class="ov ${answered(n)?"ans":""} ${m?"mk-"+m:""}" data-g="${n}"><b>${x.t==="r"?qno(x.k):`W${x.k+1}`}</b><span>${lab}</span><span class="st">${answered(n)?"解答済み":"未解答"}</span></button>
      <button class="mkb ${m}" data-mk="${n}" aria-label="${x.t==="r"?qno(x.k):`W${x.k+1}`}の印を切り替える（今：${m?MK[m][1]:"なし"}）">${m?`${MK[m][0]} ${MK[m][1]}`:"＋ 印"}</button></div>`};
  main.innerHTML=`<section class="panel stack"><h2>問題一覧</h2>
    <div class="legend"><span>未解答：${un}問</span><span>⚑ 見直し：${fl}問</span><span>？ 自信なし：${us}問</span><span>番号を押すとその問題に移動します。右下の「＋ 印」を押すたびに、見直し → 自信なし → なし と切り替わります</span></div>
    <div class="row"><label class="chk"><input type="checkbox" id="ovOnly" ${only?"checked":""}> 印のある問題だけ表示</label></div>
    ${S.scope!=="write"?`<b style="font-size:14px">リーディング</b><div class="ovgrid">${R.map((x,n)=>x.t==="r"?card(n):"").join("")}</div>`:""}
    ${S.scope!=="read"?`<b style="font-size:14px">ライティング</b><div class="ovgrid">${R.map((x,n)=>x.t==="w"?card(n):"").join("")}</div>`:""}
    ${S.cf?`<div class="dialog" role="alertdialog" aria-labelledby="cft"><b id="cft">解答を終了しますか？</b><p style="font-size:14px">${un?`未解答の問題が${un}問あります。`:""}${fl?`見直しの印がついた問題が${fl}問あります。`:""}${us?`自信なしの印がついた問題が${us}問あります。`:""}終了すると、この試験には戻れません。</p><div class="row"><button class="btn primary" id="cfY">終了する</button><button class="btn" id="cfN">キャンセル</button></div></div>`:""}
  </section>`;
  main.querySelectorAll(".ov").forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;S.ov=false;S.cf=false;rw()});
  main.querySelectorAll(".mkb").forEach(b=>b.onclick=()=>{const n=+b.dataset.mk,m=mkOf(n);S.mk[mkKey(n)]=m===""?"rev":m==="rev"?"uns":"";if(!S.mk[mkKey(n)])delete S.mk[mkKey(n)];S.run++;overview()});
  $("#ovOnly").onchange=e=>{S.ovOnly=e.target.checked;S.run++;overview()};
  tool(`<div class="grp"><button class="btn" id="bk">問題に戻る</button></div><div class="grp"><button class="btn primary" id="endb">解答を終了する</button></div>`);
  $("#bk").onclick=()=>{S.ov=false;S.cf=false;rw()};
  $("#endb").onclick=()=>{S.cf=true;rw();$("#cfY").focus()};
  if($("#cfY")){$("#cfY").onclick=()=>{S.done.rw=true;go("result")};$("#cfN").onclick=()=>{S.cf=false;rw()}}
  if(!tick)rwTimer();
}

// 答え合わせの上に、印をつけた問題の数と正解数を出す
function mkBar(t){

  if(!ks.length)return"";
  const cnt=m=>{const a=ks.filter(k=>S.mk[t+k]===m);return a.length?`<span>${MK[m][0]} ${MK[m][1]}：${a.length}問（正解 ${a.filter(k=>ans[k]===arr[k].ans).length}問）</span>`:""};
  return`<div class="mkbar">${cnt("rev")}${cnt("uns")}<label class="chk"><input type="checkbox" class="onlymk"> 印をつけた問題だけ表示</label></div>`;
}
const olist=(en,ja,ans)=>`<div class="olist">${en.map((o,j)=>`<div class="${j===ans?"ca":""}">${j+1}. ${esc(o)}${ja&&ja[j]?`<span class="ja">${esc(ja[j])}</span>`:""}</div>`).join("")}</div>`;
const scrHTML=(scr,lab)=>scr&&scr.length?`<details class="inner"><summary>${lab||"スクリプトと和訳を表示"}</summary><div class="dbody scr">${scr.map(([sp,en,ja])=>`<p>${sp?`<span class="sp">${sp}</span>`:""}${esc(en)}<span class="ja">${esc(ja)}</span></p>`).join("")}</div></details>`:"";

  S.sec=null;head(null);tool(null);chrome();

  main.innerHTML=`<section class="panel stack">
    <div class="row"><h1>${S.name?esc(S.name)+"さん、":""}おつかれさまでした</h1>${S.aborted?'<span class="stopped">途中で中止</span>':""}</div>
    <p class="muted">${g.label}　${g.title}　${S.scope==="all"?"模擬試験":SCOPES.find(x=>x[0]===S.scope)[1]}の結果</p>

      ${inS("listen")?`<div><span>リスニング</span>${S.started.listen?`<b>${lc} / ${LQ().length}</b><small class="bp">${byPart(g.listen,"part")}</small>`:na}</div>`:""}
      ${inS("read")?`<div><span>リーディング</span>${S.started.rw?`<b>${rc} / ${g.read.length}</b><small class="bp">${byPart(g.read,"p")}</small>`:na}</div>`:""}
      ${inS("write")?`<div><span>ライティング 語数</span>${S.started.rw?`<b>${wN.join("・")}</b>`:na}</div>`:""}
      ${inS("speak")?`<div><span>スピーキング 自己評価</span>${S.started.speak?`<b id="selfsum">${selfN} / ${g.speak.qs.length}</b>`:na}</div>`:""}
    </div>
    <p class="note">本番はCSEスコアで合否が判定されます。この模擬の正答数はスコアに換算していません。詳しい解説は過去問集の解答冊子（${g.title}）を見てください。${S.aborted?"途中で中止したため、受験していない問題は未解答として扱っています。":""}${reps?`スピーキングで「もう一度聞く」を${reps}回使いました。本番では評価に影響する場合があります。`:""}</p>
  </section>
  ${inS("speak")?`<details ${S.started.speak?"open":""}><summary>スピーキング：解答例と自己評価</summary><div class="dbody">
    <div>${cardHTML("front")}</div>
    ${myRecHTML(0)}
    <div class="row"><button class="btn" data-play="${g.speak.model}">${g.speak.passage?"音読":"ナレーション"}のお手本を聞く</button>${Object.keys(REC.items).length?'<button class="btn" id="toRecs">過去の録音も見る</button>':""}</div>
    ${g.speak.narration?`<div class="model">ナレーション解答例：${esc(g.speak.narration)}</div>`:""}
    ${g.speak.qs.map((q,k)=>`<div class="rv"><div class="row"><b>No. ${q.n}</b><button class="btn sm" data-play="${q.f}">質問を聞く</button></div><p class="en" style="font-size:15px">${esc(q.q)}${q.follow?`<br><span class="muted" style="font-size:13px">${esc(q.follow)}</span>`:""}</p>
      ${myRecHTML(k+1)}
      <div class="model">解答例：${esc(q.a)}</div>
      <div class="selfrate" data-q="${k}">${[["ok","答えられた"],["mid","一部言えた"],["ng","言えなかった"]].map(([v,l])=>`<button aria-pressed="${S.self[k]===v}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}
    <p class="note">${g.speak.tip}</p></div></details>`:""}
  ${inS("listen")?`<details ${S.scope==="listen"?"open":""}><summary>リスニング：答え合わせ（和訳つき）</summary><div class="dbody">${mkBar("l")}
    ${g.listen.map((it,k)=>it.kind==="pas"?`<div class="rv"><div class="row"><b>第${it.part}部 (${it.label}) 英文</b><button class="btn sm" data-play="${it.f}">英文を聞く</button></div>${scrHTML(it.scr,"英文と和訳を表示")}</div>`:`<div class="rv" ${S.mk["l"+k]?`data-mk="${S.mk["l"+k]}"`:""}><div class="row">${mark(S.la[k]===it.ans)}<b>第${it.part}部 No. ${it.no}</b>${mkTag("l"+k)}<span class="muted" style="font-size:13px">あなたの解答：${S.la[k]==null?"未解答":S.la[k]+1}　正解：${it.ans+1}</span><button class="btn sm" data-play="${it.f}">音声を聞く</button></div>
      ${it.situ?`<p class="en" style="font-size:14px"><b>Situation:</b> ${esc(it.situ)}${it.sitj?`<span class="qja">${esc(it.sitj)}</span>`:""}</p>`:""}
      ${it.sq?`<p class="en" style="font-size:14px"><b>Question:</b> ${esc(it.sq)}${it.sqj?`<span class="qja">${esc(it.sqj)}</span>`:""}</p>`:it.qq?`<p class="en" style="font-size:14px"><b>Question:</b> ${esc(it.qq[0])}<span class="qja">${esc(it.qq[1])}</span></p>`:""}
      ${(it.read?it.oe:it.opts)?olist(it.read?it.oe:it.opts,it.oj,it.ans):""}
      ${scrHTML(it.scr)}</div>`).join("")}
  </div></details>`:""}
  ${inS("read")?`<details ${S.scope==="read"?"open":""}><summary>リーディング：答え合わせ（和訳つき）</summary><div class="dbody">${mkBar("r")}
    ${g.read.map((it,k)=>`<div class="rv" ${S.mk["r"+k]?`data-mk="${S.mk["r"+k]}"`:""}><div class="row">${mark(S.ra[k]===it.ans)}<b>大問${it.p} ${qno(k)}</b>${mkTag("r"+k)}<span class="muted" style="font-size:13px">あなたの解答：${S.ra[k]==null?"未解答":S.ra[k]+1}　正解：${it.ans+1}</span></div>
      <p class="en" style="font-size:15px">${it.blank?`本文の空所 (${it.blank})`:it.q}${it.qj?`<span class="qja">${it.qj}</span>`:""}</p>${olist(it.o,it.oj,it.ans)}</div>`).join("")}
    <details class="inner"><summary>本文を表示</summary><div class="dbody">${Object.keys(g.pas).map(passageHTML).join("")}</div></details>
  </div></details>`:""}

      <div class="mine">${S.wa[k].trim()?esc(S.wa[k]):"（未記入）"}</div>
      <span class="wc"><span>語数 <b>${wN[k]}</b> 語（目安 ${w.min}〜${w.max}語）</span></span>

/* ===================== AI添削（Claudeのページで開いたときだけ） ===================== */
let samplerP=null;
function getSampler(){if(!samplerP)samplerP=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);return samplerP}
async function setupAI(){
  if(!$("#aibox"))return;if(S.ai){$("#aibox").innerHTML=S.ai;return}
  const sample=await getSampler();if(!sample||!$("#aibox"))return;
  const g=G();if(!S.wa.some(t=>t.trim()))return;
  $("#aibox").innerHTML=`<div class="ai"><b>AI添削</b><p style="font-size:14px">英検${g.label}の採点観点に沿って、あなたの英文にコメントします。</p><div class="row"><button class="btn primary" id="aig">添削してもらう</button></div></div>`;
  $("#aig").onclick=async()=>{
    const b=$("#aig");b.disabled=true;b.textContent="添削中…";
    const task=g.write.map((w,k)=>({type:w.label,task:w.plain,range:`${w.min}-${w.max} words`,answer:S.wa[k].trim()||"(no answer)"}));
    const prompt=`あなたは英検${g.label}ライティングの採点者です。${g.audience}の解答を、英検${g.label}の観点で採点・添削してください。\n${g.rubric}\n語数が目安から大きく外れている場合や、問いに答えていない場合は内容を減点。未解答は全て0点。\nコメントは受験者にわかる日本語で、良い点1つと直すべき点を具体的に。直した英文も示す。\n次のJSONだけを返す: {"results":[{"type":"…","scores":{"観点名":点数},"max":満点合計,"good":"…","fix":["…"],"revised":"英文"}]}\n解答: ${JSON.stringify(task)}`;
    try{
      const out=await sample.json(prompt,{modelTier:"default"});const rs=(out&&out.results)||[];
      const html=`<div class="ai"><b>AI添削の結果</b>${rs.map(r=>{const sc=r.scores||{};const tot=Object.values(sc).reduce((a,c)=>a+(+c||0),0);
        return `<div class="rv"><b>${esc(r.type||"")}　${tot} / ${esc(r.max??"")}</b><table>${Object.entries(sc).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>${r.good?`<p style="font-size:14px">◎ ${esc(r.good)}</p>`:""}${(r.fix||[]).map(f=>`<p style="font-size:14px">△ ${esc(f)}</p>`).join("")}${r.revised?`<div class="model">${esc(r.revised)}</div>`:""}</div>`}).join("")}<p class="note">AIによる目安の採点です。</p></div>`;
      S.ai=html;if($("#aibox"))$("#aibox").innerHTML=html;
      const got=rs.reduce((a,r)=>a+Object.values(r.scores||{}).reduce((x,c)=>x+(+c||0),0),0),mx=rs.reduce((a,r)=>a+(+r.max||0),0);if(mx>0){S.aiW=[got,mx];saveResult()}
    }catch(e){if(e&&e.code==="not_granted"){$("#aibox").innerHTML="";return}b.disabled=false;b.textContent="もう一度試す"}
  };
}
(async()=>{
  if(EX)return render();
  const t=await fdb(st=>st.get("data"),"readonly");
