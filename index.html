<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>英検S-CBT模擬試験</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: CBT terminal — fixed exam header (級・技能・受験者・残り時間・中止), working area, fixed bottom toolbar. */
:root{
  --bg:#e4e8ee; --surface:#ffffff; --sunk:#f2f4f7; --ink:#1a2230; --muted:#5a6476; --line:#c4ccd8; --line2:#9aa6b8;
  --bar:#24466f; --bar2:#1a3554; --bar-ink:#f2f5fa; --tool:#d7dde6; --tool-ink:#1a2230;
  --accent:#d08a1e; --accent-soft:#fcefd6; --rec:#d23b3b; --rec-soft:#fbe3e3;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --ng:#b03a3a; --ng-soft:#f8e2e2; --sel:#1f5aa6; --sel-soft:#e1ebf8;
  --ill-skin:#f2c9a5; --ill-a:#3d7bc4; --ill-b:#d9534f; --ill-green:#6fa35a; --ill-wood:#c99a62; --ill-line:#2b3443; --ill-hair:#3a2e28; --ill-bg:#f8f5ee; --vid:#2f3d4f;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --en:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#18202b; --sunk:#121922; --ink:#e5e9ef; --muted:#9aa5b6; --line:#2e3a4b; --line2:#4a5870;
  --bar:#1b3555; --bar2:#132840; --bar-ink:#e8eef7; --tool:#1f2935; --tool-ink:#e5e9ef;
  --accent:#e6a44a; --accent-soft:#3a2d17; --rec:#ef6b6b; --rec-soft:#3d1c1c;
  --ok:#5cbf85; --ok-soft:#183325; --ng:#e47b7b; --ng-soft:#3a1d1d; --sel:#7fb0ee; --sel-soft:#1b2c44;
  --ill-skin:#e0b48f; --ill-a:#5b93d6; --ill-b:#e06a66; --ill-green:#6f9f5c; --ill-wood:#a87d4c; --ill-line:#cfd7e3; --ill-hair:#6b5242; --ill-bg:#202a37; --vid:#0b1119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#18202b; --sunk:#121922; --ink:#e5e9ef; --muted:#9aa5b6; --line:#2e3a4b; --line2:#4a5870;
  --bar:#1b3555; --bar2:#132840; --bar-ink:#e8eef7; --tool:#1f2935; --tool-ink:#e5e9ef;
  --accent:#e6a44a; --accent-soft:#3a2d17; --rec:#ef6b6b; --rec-soft:#3d1c1c;
  --ok:#5cbf85; --ok-soft:#183325; --ng:#e47b7b; --ng-soft:#3a1d1d; --sel:#7fb0ee; --sel-soft:#1b2c44;
  --ill-skin:#e0b48f; --ill-a:#5b93d6; --ill-b:#e06a66; --ill-green:#6f9f5c; --ill-wood:#a87d4c; --ill-line:#cfd7e3; --ill-hair:#6b5242; --ill-bg:#202a37; --vid:#0b1119; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto}

/* ---------- header ---------- */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;color:var(--bar-ink)}
.bar1{background:var(--bar);padding-block:8px}
.bar1 .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv{font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.45);border-radius:3px;padding:2px 8px;white-space:nowrap}
.sec{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12px;opacity:.8;white-space:nowrap}
.tbox{display:flex;align-items:center;gap:8px;background:var(--bar2);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:3px 10px;min-width:9.5em;justify-content:space-between}
.tbox small{font-size:11px;opacity:.75;white-space:nowrap}
.tbox b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tbox.warn b{color:var(--accent)}
.abort{font:inherit;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--bar-ink);border-radius:3px;padding:4px 12px;cursor:pointer;min-height:34px}
.abort:hover{background:rgba(255,255,255,.12)}
.bar2{background:var(--bar2);padding-block:4px}
.bar2 .in{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.bar2 span{padding:2px 10px;border-radius:2px;opacity:.55}
.bar2 span.on{background:var(--accent);color:#1b1305;opacity:1;font-weight:700}
.bar2 span.done{opacity:.85}
.bar2 span.done::before{content:"✓ "}
.vol{margin-left:auto;display:flex;align-items:center;gap:6px;opacity:.95}
.vol input{width:110px;accent-color:var(--accent)}

main{padding-block:16px 24px}
main.hasfoot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main>.in{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px clamp(16px,3vw,26px)}
h1{font-size:clamp(21px,3.6vw,28px);line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.en{font-family:var(--en);font-size:17px;line-height:1.8}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:3px;cursor:pointer;min-height:44px;box-shadow:0 1px 0 var(--line)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--accent)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn.flag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;padding:8px 12px;border:1px solid var(--line2);border-radius:3px;background:var(--sunk);color:var(--ink);max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scopes .gbtn b{font-size:16px}
.gbtn{font:inherit;text-align:left;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:4px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.gbtn b{font-size:20px;line-height:1.3}
.gbtn span{font-size:12px;color:var(--muted)}
.gbtn:hover{background:var(--sunk)}
.gbtn[aria-checked="true"]{border-color:var(--sel);background:var(--sel-soft);box-shadow:inset 0 0 0 1px var(--sel)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.flow div{padding:12px 14px;border-right:1px solid var(--line);background:var(--sunk);min-width:0}
.flow div:last-child{border-right:0}
.flow b{display:block}
.flow span{font-size:12.5px;color:var(--muted);display:block;line-height:1.55}
.flow i{font-style:normal;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.1em}
@media (max-width:640px){.flow{grid-template-columns:1fr}.flow div{border-right:0;border-bottom:1px solid var(--line)}.flow div:last-child{border-bottom:0}}

/* ---------- question frame ---------- */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:8px 14px}
.qbar b{font-size:15px}
.qbar .qn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qframe{background:var(--surface);border:1px solid var(--line);border-radius:0 0 4px 4px;padding:18px clamp(14px,2.6vw,24px);display:flex;flex-direction:column;gap:14px}
.direc{font-size:14px;background:var(--sunk);border-left:4px solid var(--bar);padding:8px 12px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.split .pane{min-width:0}
@media (min-width:861px){.split .pane.scroll{max-height:calc(100vh - 290px);overflow:auto;padding-right:6px}}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.passage{background:var(--surface);border:1px solid var(--line2);padding:14px 16px}
.passage h4{font-family:var(--en);text-align:center;margin:0 0 6px;font-size:17px}
.mail-h{font-family:var(--en);font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;line-height:1.6}
.qstem{display:flex;gap:10px;align-items:flex-start}
.qstem .no{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--en);font-size:17px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.opt:hover{background:var(--sunk)}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.opt .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent}
.opt .k{flex:none;font-weight:700;width:1.2em;font-variant-numeric:tabular-nums}
.opt .t{font-family:var(--en);font-size:16.5px;min-width:0}
.opt[aria-checked="true"]{border-color:var(--sel);background:var(--sel-soft)}
.opt[aria-checked="true"] .rd{border-color:var(--sel)}
.opt[aria-checked="true"] .rd::after{background:var(--sel)}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts.inline .opt{width:auto;flex:1 1 110px}
.blank{font-family:var(--en);font-weight:700;border-bottom:1.5px solid var(--ink);padding:0 6px}

/* ---------- fixed toolbar ---------- */
footer.tool{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tool);color:var(--tool-ink);border-top:1px solid var(--line2);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
footer.tool .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer.tool .grp{display:flex;gap:8px;flex-wrap:wrap}
footer.tool .msg{font-size:12.5px;color:var(--muted)}

/* ---------- pause / abort dialog ---------- */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(8,14,22,.6);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ovl[hidden],.tbox[hidden]{display:none!important}
.dlg{background:var(--surface);color:var(--ink);border-radius:6px;border:1px solid var(--line);max-width:460px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg .col{display:flex;flex-direction:column;gap:8px}
.dlg .col .btn{width:100%}

/* ---------- overview ---------- */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ov{font:inherit;text-align:left;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:3px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.ov:hover{background:var(--sunk)}
.ov b{font-variant-numeric:tabular-nums}
.ov span{font-size:12px;color:var(--muted)}
.ov.ans{background:var(--sel-soft);border-color:var(--sel)}
.ov .st{font-weight:700;font-size:12px;color:var(--ng)}
.ov.ans .st{color:var(--sel)}
.ov.flg::after{content:"見直し";position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;background:var(--accent);color:#1b1305;padding:0 6px;border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dialog{border:2px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* ---------- speaking ---------- */
.spk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:860px){.spk{grid-template-columns:1fr}}
.video{background:var(--vid);border-radius:4px;overflow:hidden;position:relative;aspect-ratio:4/3;max-width:100%}
.video svg{width:100%;height:100%;display:block}
.video .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-family:var(--en);font-size:15px;padding:8px 12px;line-height:1.5}
.mouth{transform-origin:150px 128px;transform-box:view-box}
.talking .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
.recbox{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;background:var(--sunk)}
.mic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--rec-soft)}100%{box-shadow:0 0 0 12px transparent}}
.recbox .lbl{font-weight:700}
.recbox .lbl.on{color:var(--rec)}
.recbox .cd{margin-left:auto;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-m{height:6px;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar-m i{display:block;height:100%;width:0;background:var(--sel)}
.bar-m.on i{background:var(--rec)}
.qcard{border:2px solid var(--line2);background:var(--surface);padding:16px}
.qcard h3{font-family:var(--en);text-align:center;margin:0 0 6px;font-size:18px}
.qcard .back{display:grid;place-items:center;min-height:200px;color:var(--muted);font-size:14px;text-align:center}
svg.pic{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--ill-bg);margin-top:12px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.pics.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pics figcaption{font-weight:700;font-size:13px;font-family:var(--en)}
.pics svg{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--ill-bg)}
.opening{font-family:var(--en);border:1.5px solid var(--line2);padding:6px 10px;font-size:15px;margin-top:10px;line-height:1.6}
.script{font-family:var(--en);font-size:15px;background:var(--sunk);border:1px dashed var(--line2);padding:8px 12px}

/* ---------- listening ---------- */
.lstage{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:12px 14px;flex-wrap:wrap}
.spk-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.spk-ic.on{border-color:var(--sel);color:var(--sel)}
.spk-ic svg{width:20px;height:20px}
.lstage .lbl{font-weight:700}
.lstage .bar-m{flex:1;min-width:120px}

/* ---------- writing ---------- */
textarea{font-family:var(--en);font-size:16px;line-height:1.7;width:100%;min-height:220px;padding:12px;border:1px solid var(--line2);border-radius:2px;background:var(--surface);color:var(--ink);resize:vertical}
.wc{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wc b{color:var(--ink)}
.u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.points{font-family:var(--en);font-size:15px;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}

/* ---------- results ---------- */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum div{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.sum b.na{font-size:16px;color:var(--muted);padding-top:6px}
.sum span{font-size:12px;color:var(--muted)}
.stopped{display:inline-block;font-size:12px;font-weight:700;color:var(--ng);background:var(--ng-soft);border-radius:3px;padding:1px 8px}
details{border:1px solid var(--line);border-radius:4px;background:var(--surface)}
details>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.rv{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.ng{background:var(--ng-soft);color:var(--ng)}
.model{font-family:var(--en);background:var(--ok-soft);border-radius:3px;padding:8px 12px;font-size:15px}
.mine{font-family:var(--en);background:var(--sunk);border-radius:3px;padding:8px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.selfrate{display:flex;gap:6px;flex-wrap:wrap}
.selfrate button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.selfrate button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.ai{border:1px solid var(--sel);border-radius:4px;padding:12px 14px;background:var(--sel-soft);display:flex;flex-direction:column;gap:8px}
.ai table{border-collapse:collapse;font-size:14px}
.ai td{padding:3px 10px 3px 0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.talking .mouth,.mic.on{animation:none}}
</style>

<div class="app">
  <header class="bar">
    <div class="bar1 gut"><div class="in">
      <span class="lv" id="lv">3級</span>
      <span class="sec" id="secname">英検S-CBT 模擬試験</span>
      <span class="who" id="who"></span>
      <div class="tbox" id="tbox" hidden><small id="tlabel">残り時間</small><b id="tval">0:00</b></div>
      <button class="abort" id="abortBtn" hidden>中止</button>
    </div></div>
    <div class="bar2 gut"><div class="in" id="rail"></div></div>
  </header>
  <main id="mainwrap" class="gut"><div class="in" id="main"></div></main>
  <footer class="tool gut" id="tool" hidden><div class="in" id="toolin"></div></footer>
  <div class="ovl" id="ovl" hidden>
    <div class="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
      <h2 id="dlgT">試験を一時停止しています</h2>
      <p id="dlgP" style="font-size:14px"></p>
      <div class="col">
        <button class="btn primary" id="dResume">再開する</button>
        <button class="btn" id="dResult">中止して、ここまでの結果を見る</button>
        <button class="btn danger" id="dHome">中止してトップに戻る（解答は消えます）</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ===================== イラスト部品 ===================== */
function P(x,y,o={}){
  const s=o.s||1,c=o.c||"var(--ill-a)",la=o.la||[-6,26],ra=o.ra||[6,26];
  const legs=o.legs==="sit"?"M-4 -36 L14 -36 L14 -6 M4 -36 L20 -36 L20 -6":o.legs==="walk"?"M-5 -36 L-12 0 M5 -36 L10 0":"M-5 -36 L-6 0 M5 -36 L6 0";
  const hair=o.long?"M-12 -80 q0 -15 12 -15 q12 0 12 15 v16 h-5 v-14 q-7 -7 -14 0 v14 h-5z":"M-11 -82 q11 -18 22 0 q-3 -8 -11 -9 q-8 1 -11 9z";
  return `<g transform="translate(${x} ${y}) scale(${s})" stroke="var(--ill-line)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="${legs}" fill="none" stroke-width="3"/>
    <rect x="-10" y="-68" width="20" height="33" rx="4" fill="${c}"/>
    <path d="M-9 -64 l${la[0]} ${la[1]} M9 -64 l${ra[0]} ${ra[1]}" fill="none" stroke-width="3"/>
    <circle cx="0" cy="-80" r="11" fill="var(--ill-skin)"/>
    <path d="${hair}" fill="var(--ill-hair)" stroke="none"/>
    <circle cx="-4" cy="-80" r="1.4" fill="var(--ill-line)" stroke="none"/><circle cx="4" cy="-80" r="1.4" fill="var(--ill-line)" stroke="none"/>
    ${o.smile?'<path d="M-4 -75 q4 4 8 0" fill="none" stroke-width="1.5"/>':""}
    ${o.extra||""}</g>`;
}

 write:[
  {label:"Eメール",min:40,max:50,
   instr:"あなたは、外国人の知り合い（Sam）から以下のEメールを受け取りました。Eメールを読み、それに対する返信メールを英文で書きなさい。あなたが書く返信メールの中で、Samのメール文中の下線部について、あなたがより理解を深めるために、下線部の特徴を問う具体的な質問を2つしなさい。また、Samからの質問にも答えなさい。語数の目安は40語～50語です。解答欄の外に書かれたものは採点されません。",
   prompt:"Hi!<br>Guess what? My family <span class=\"u\">got a new pet</span> last week. My little brother wanted one for a long time, so he is very happy. It is really cute, but taking care of it is a lot of work. By the way, do you think it is good for children to have pets?<br>Your friend,<br>Sam",

 pas:{
  air:{title:"Cleaner Air in Cities",body:"In many large cities, air pollution has been a serious problem for years. Cars and factories produce gases that can make it hard for people to breathe. To solve this problem, some cities have started <span class=\"blank\">(5)</span>. In some European cities, for example, cars are not allowed on certain streets on weekends, and people walk or ride bicycles instead.<br><br>These changes have had good results. After the streets were closed to cars, the amount of harmful gases in the air dropped. However, not everyone is happy. Some shop owners say that fewer customers visit their stores because they cannot come by car. <span class=\"blank\">(6)</span>, city governments are trying to find a balance between clean air and business."},
  sleep:{title:"Teenagers and Sleep",body:"Many teenagers today do not get enough sleep. Experts say that people between 13 and 18 years old need about eight to ten hours of sleep each night. However, a survey in one country found that more than half of high school students sleep less than seven hours.<br><br>One reason is the use of smartphones at night. The light from smartphone screens can tell the brain that it is still daytime, so it becomes harder to fall asleep. Also, many students use their phones to chat with friends late at night.<br><br>Some schools have tried a new idea. They start classes later in the morning so that students can sleep longer. At one school that tried this, students' test scores improved, and fewer students were late for school. Teachers also said that students were more active in class. Although later start times can cause problems for parents who need to go to work early, many experts believe that the idea is worth trying."}},

 writeDesc:"ライティングは要約（45〜55語）と英作文（80〜100語）の2問です。",
 write:[
  {label:"要約",min:45,max:55,
   instr:"以下の英文を読んで、その内容を英語で要約し、解答欄に記入しなさい。語数の目安は45語～55語です。解答欄の外に書かれたものは採点されません。解答が英文の要約になっていないと判断された場合は、0点と採点されることがあります。英文をよく読んでから答えてください。",
   prompt:"Many people in Japan have started using self-checkout machines at supermarkets. With these machines, customers scan the items they buy and pay by themselves without the help of a cashier.<br><br>Self-checkout machines have some advantages for stores. Stores do not need to hire as many workers, so they can save money. Also, customers who buy only a few items can finish shopping quickly because they do not need to wait in long lines.<br><br>However, some customers find self-checkout machines difficult to use. For example, many elderly people are not used to using machines like these. In addition, some customers make mistakes when they scan items, and stores sometimes lose money as a result.",
   plain:"Many people in Japan have started using self-checkout machines at supermarkets. With these machines, customers scan the items they buy and pay by themselves without the help of a cashier. Self-checkout machines have some advantages for stores. Stores do not need to hire as many workers, so they can save money. Also, customers who buy only a few items can finish shopping quickly because they do not need to wait in long lines. However, some customers find self-checkout machines difficult to use. For example, many elderly people are not used to using machines like these. In addition, some customers make mistakes when they scan items, and stores sometimes lose money as a result.",
   model:"Self-checkout machines, which let customers pay without a cashier, are becoming common in Japanese supermarkets. They help stores save money on workers and let customers with few items shop quickly. However, some people, especially elderly people, find them hard to use, and scanning mistakes can cause stores to lose money."},
  {label:"英作文",min:80,max:100,
   instr:"以下のTOPICについて、あなたの意見とその理由を2つ書きなさい。POINTSは理由を書く際の参考となる観点を示したものです。ただし、これら以外の観点から理由を書いてもかまいません。語数の目安は80語～100語です。解答欄の外に書かれたものは採点されません。解答がTOPICに示された問いの答えになっていない場合や、TOPICからずれていると判断された場合は、0点と採点されることがあります。",
   prompt:"<b>TOPIC</b><br>Some people say that more people will live in big cities in the future. Do you think this will happen?<div class=\"points\"><b>POINTS</b><br>● Jobs　● Convenience　● Cost of living</div>",
   plain:"TOPIC: Some people say that more people will live in big cities in the future. Do you think this will happen? POINTS: Jobs / Convenience / Cost of living",
   model:"I think more people will live in big cities in the future. I have two reasons. First, there are many more jobs in big cities than in the countryside. Many young people move to cities such as Tokyo and Osaka to find good jobs. Second, life in big cities is very convenient. People can easily use trains and buses, and there are many hospitals and stores near their homes. For these two reasons, I believe more people will choose to live in big cities."}],

}};

const SCOPES=[["all","4技能すべて","本番と同じ流れ"],["speak","スピーキングだけ","面接形式"],["listen","リスニングだけ","音声は各2回"],["read","リーディングだけ","時間を計って解く"],["write","ライティングだけ","キーボード入力"]];
const inS=k=>S.scope==="all"||S.scope===k;
function secs(){
  const all=[["speak","スピーキング"],["listen","リスニング"],["rw",S.scope==="read"?"リーディング":S.scope==="write"?"ライティング":"リーディング・ライティング"]];

  const k=S.scope==="read"||S.scope==="write"?"rw":S.scope;

/* ===================== タイマー ===================== */
let tick=null;
function startTimer(secs,expire,each){
  stopTimer();const end=Date.now()+secs*1000;let fired=false;
  const f=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));each&&each(left,secs);
    if(left<=0&&!fired){fired=true;stopTimer();expire&&expire()}};
  f();tick=setInterval(f,200);
}
function stopTimer(){clearInterval(tick);tick=null}
function head(left,label){
  const b=$("#tbox");
  if(left==null){b.hidden=true;return}
  b.hidden=false;$("#tlabel").textContent=label||"残り時間";$("#tval").textContent=fmt(left);
  b.classList.toggle("warn",label==="残り時間"&&left<=300);
}

/* ===================== 音声 ===================== */
const TTS="speechSynthesis" in window&&typeof SpeechSynthesisUtterance!=="undefined";
let VOICES={};
function loadVoices(){
  if(!TTS)return;
  const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]?(US|GB)?/i.test(v.lang));if(!vs.length)return;
  const fem=vs.find(v=>/female|samantha|zira|aria|jenny|karen|serena|google us english/i.test(v.name));
  const mal=vs.find(v=>/\bmale|daniel|david|alex|fred|guy|uk english male/i.test(v.name)&&v!==fem);
  VOICES={W:fem||vs[0],M:mal||vs[1]||vs[0],N:vs.find(v=>/en-US/i.test(v.lang))||vs[0]};
}
if(TTS){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(text,who="N"){
  return new Promise(res=>{
    if(!TTS){setTimeout(res,700);return}
    let done=false;const fin=()=>{if(!done){done=true;res()}};
    const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.88;u.volume=S.vol;
    const v=VOICES[who];if(v)u.voice=v;
    if(VOICES.W===VOICES.M)u.pitch=who==="W"?1.25:who==="M"?0.8:1;
    u.onend=fin;u.onerror=fin;
    try{speechSynthesis.speak(u)}catch(e){fin()}
    setTimeout(fin,text.length*130+5000);
  });
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
function hush(){S.run++;if(TTS)try{speechSynthesis.cancel()}catch(e){}stopTimer()}

/* ===================== 一時停止・中止 ===================== */
function pause(){

  $("#dlgP").innerHTML=(S.screen==="rw"?"制限時間は止まっています。":"")+

function resume(){
  if(!S.paused)return;

}

function speak(){
  const SS=steps();const st=SS[S.i];const run=++S.run;head(null);
  main.innerHTML=`<div>
    <div class="qbar"><b>${st.lab}</b><span class="qn">${S.i+1} / ${SS.length}</span></div>

function scriptHTML(it){
  const nm={W:"★",M:"☆",N:""};
  let h=it.lines.map(([w,t])=>`${nm[w]?nm[w]+": ":""}${esc(t)}`).join("<br>");
  if(it.read)h+="<br>"+it.opts.map((o,k)=>`${k+1}. ${esc(o)}`).join("<br>");
  else h+=`<br><b>Question:</b> ${esc(it.q)}`;
  return h;
}

/* ===================== リーディング・ライティング ===================== */
function answered(n){const x=RW()[n];return x.t==="r"?S.ra[x.k]!=null:wcount(S.wa[x.k])>0}
function flagged(n){const x=RW()[n];return x.t==="r"?!!S.rf[x.k]:!!S.wf[x.k]}
function rwTimer(){
  const left=Math.max(0,Math.ceil((S.end-Date.now())/1000));
  startTimer(left,()=>{S.done.rw=true;go("result")},l=>head(l,"残り時間"));
}
function rw(){
  S.run++;
  if(S.ov)return overview();
  const R=RW(),x=R[S.i];
  if(x.t==="r")readQ(x.k);else writeQ(x.k);
  tool(`<div class="grp"><button class="btn" id="ovb">問題一覧</button><button class="btn flag" id="fl" aria-pressed="${flagged(S.i)}">見直し</button></div>
    <div class="grp"><button class="btn" id="pv" ${S.i===0?"disabled":""}>前へ</button>
    <button class="btn primary" id="nx">${S.i<R.length-1?"次へ":"問題一覧へ"}</button></div>`);
  $("#ovb").onclick=()=>{S.ov=true;rw()};
  $("#fl").onclick=()=>{const x=RW()[S.i];if(x.t==="r")S.rf[x.k]=!S.rf[x.k];else S.wf[x.k]=!S.wf[x.k];$("#fl").setAttribute("aria-pressed",flagged(S.i))};
  $("#pv").onclick=()=>{S.i--;rw();window.scrollTo(0,0)};
  $("#nx").onclick=()=>{if(S.i<R.length-1)S.i++;else S.ov=true;rw();window.scrollTo(0,0)};
  if(!tick)rwTimer();
}
function passageHTML(key){
  const p=G().pas[key];
  return `<div class="passage">${p.head?`<div class="mail-h">${p.head}</div>`:""}${p.title?`<h4>${p.title}</h4>`:""}<p class="en" style="font-size:16px">${p.body}</p></div>`;
}
function readQ(k){
  const it=G().read[k];const no=k+1;
  const stem=it.blank?`<div class="qstem"><span class="no">(${no})</span><p style="min-width:0;line-height:1.8">本文の空所 <span class="blank">(${it.blank})</span> に入れるのに最も適切なもの</p></div>`
    :`<div class="qstem"><span class="no">(${no})</span><p class="en" style="min-width:0">${it.q}</p></div>`;
  const opts=`<div class="opts" role="radiogroup" aria-label="(${no})の解答">${it.opts.map((o,j)=>`<button class="opt" role="radio" aria-checked="${S.ra[k]===j}" data-k="${j}"><span class="rd"></span><span class="k">${j+1}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>`;
  main.innerHTML=`<div>
    <div class="qbar"><b>リーディング　大問${it.part}</b><span class="qn">(${no})　問題 ${S.i+1} / ${RW().length}</span></div>
    <div class="qframe">
      <p class="direc">${G().rdir[it.part]}</p>
      ${it.pas?`<div class="split"><div class="pane scroll">${passageHTML(it.pas)}</div><div class="pane stack">${stem}${opts}</div></div>`:`${stem}${opts}`}
    </div></div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ra[k]=+b.dataset.k;main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b))});
}
function writeQ(k){
  const it=G().write[k];
  main.innerHTML=`<div>
    <div class="qbar"><b>ライティング　${it.label}</b><span class="qn">問題 ${S.i+1} / ${RW().length}</span></div>
    <div class="qframe">
      <p class="direc">${it.instr}</p>
      <div class="split">
        <div class="pane scroll"><div class="passage"><p class="en" style="font-size:16px">${it.prompt}</p></div></div>
        <div class="pane stack" style="gap:8px">
          ${it.before?`<p class="en" style="font-size:16px">${it.before}</p>`:""}
          <label for="ta${k}" class="muted" style="font-size:13px">解答欄</label>
          <textarea id="ta${k}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">${esc(S.wa[k])}</textarea>
          ${it.after?`<p class="en" style="font-size:16px">${it.after}</p>`:""}
          <div class="wc" id="wc"></div>
        </div>
      </div>
    </div></div>`;
  const ta=$("#ta"+k),wc=$("#wc");
  const upd=()=>{wc.innerHTML=`<span>語数：<b>${wcount(ta.value)}</b>語</span><span>語数の目安 ${it.min}語～${it.max}語</span>`};
  ta.oninput=()=>{S.wa[k]=ta.value;upd()};upd();
}
function overview(){
  const R=RW();
  const un=R.filter((_,n)=>!answered(n)).length,fl=R.filter((_,n)=>flagged(n)).length;
  const card=n=>{const x=R[n];const lab=x.t==="r"?`リーディング 大問${G().read[x.k].part}`:`ライティング ${G().write[x.k].label}`;
    return `<button class="ov ${answered(n)?"ans":""} ${flagged(n)?"flg":""}" data-g="${n}"><b>${x.t==="r"?`(${x.k+1})`:`W${x.k+1}`}</b><span>${lab}</span><span class="st">${answered(n)?"解答済み":"未解答"}</span></button>`};
  main.innerHTML=`<section class="panel stack">
    <h2>問題一覧</h2>
    <div class="legend"><span>未解答：${un}問</span><span>見直し：${fl}問</span><span>番号を押すとその問題に移動します</span></div>
    ${S.scope!=="write"?`<b style="font-size:14px">リーディング</b><div class="ovgrid">${R.map((x,n)=>x.t==="r"?card(n):"").join("")}</div>`:""}
    ${S.scope!=="read"?`<b style="font-size:14px">ライティング</b><div class="ovgrid">${R.map((x,n)=>x.t==="w"?card(n):"").join("")}</div>`:""}
    ${S.cf?`<div class="dialog" role="alertdialog" aria-labelledby="cft"><b id="cft">解答を終了しますか？</b>
      <p style="font-size:14px">${un?`未解答の問題が${un}問あります。`:""}${fl?`見直しの印がついた問題が${fl}問あります。`:""}終了すると、この試験には戻れません。</p>
      <div class="row"><button class="btn primary" id="cfY">終了する</button><button class="btn" id="cfN">キャンセル</button></div></div>`:""}
  </section>`;
  main.querySelectorAll(".ov").forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;S.ov=false;S.cf=false;rw()});
  tool(`<div class="grp"><button class="btn" id="bk">問題に戻る</button></div><div class="grp"><button class="btn primary" id="endb">解答を終了する</button></div>`);
  $("#bk").onclick=()=>{S.ov=false;S.cf=false;rw()};
  $("#endb").onclick=()=>{S.cf=true;rw();$("#cfY").focus()};
  if($("#cfY")){$("#cfY").onclick=()=>{S.done.rw=true;go("result")};$("#cfN").onclick=()=>{S.cf=false;rw()}}
  if(!tick)rwTimer();
}

/* ===================== 結果 ===================== */
function result(){
  S.sec=null;head(null);tool(null);chrome();
  const g=G();
  const lc=g.listen.filter((x,k)=>S.la[k]===x.ans).length,rc=g.read.filter((x,k)=>S.ra[k]===x.ans).length;
  const selfN=Object.values(S.self).filter(v=>v==="ok").length,wN=g.write.map((_,k)=>wcount(S.wa[k]));
  const reps=Object.values(S.rep).reduce((a,b)=>a+b,0);
  const na='<b class="na">未受験</b>';
  const rv=(it,my,label,extra)=>`<div class="rv">
    <div class="row"><span class="tag ${my===it.ans?"ok":"ng"}">${my===it.ans?"正解":"不正解"}</span><b>${label}</b>
      <span class="muted" style="font-size:13px">あなたの解答：${my==null?"未解答":my+1}　正解：${it.ans+1}</span></div>
    ${extra||""}<p style="font-size:14px">${it.jp}</p></div>`;
  const stemOf=it=>it.blank?`${passageTitle(it.pas)} 本文の空所 (${it.blank})`:it.q;
  main.innerHTML=`<section class="panel stack">
    <div class="row"><h1>${S.name?esc(S.name)+"さん、":""}おつかれさまでした</h1>${S.aborted?'<span class="stopped">途中で中止</span>':""}</div>
    <p class="muted">${g.label}　${S.scope==="all"?"模擬試験":SCOPES.find(x=>x[0]===S.scope)[1]}の結果</p>
    <div class="sum">
      ${inS("listen")?`<div><span>リスニング</span>${S.started.listen?`<b>${lc} / ${g.listen.length}</b>`:na}</div>`:""}
      ${inS("read")?`<div><span>リーディング</span>${S.started.rw?`<b>${rc} / ${g.read.length}</b>`:na}</div>`:""}
      ${inS("write")?`<div><span>ライティング 語数</span>${S.started.rw?`<b>${wN.join("・")}</b>`:na}</div>`:""}
      ${inS("speak")?`<div><span>スピーキング 自己評価</span>${S.started.speak?`<b id="selfsum">${selfN} / ${g.speak.qs.length}</b>`:na}</div>`:""}
    </div>
    <p class="note">本番はCSEスコアで合否が判定されます。この模擬の正答数はスコアに換算していません。${S.aborted?"途中で中止したため、受験していない問題は未解答として扱っています。":""}${reps?`スピーキングで「もう一度聞く」を${reps}回使いました。本番では評価に影響する場合があります。`:""}</p>
  </section>
  ${inS("speak")?`<details ${S.started.speak?"open":""}><summary>スピーキング：解答例と自己評価</summary><div class="dbody">
    <div class="passage"><p class="en" style="font-size:15px"><b>${g.speak.title}</b><br>${g.speak.passage}</p>${g.speak.art()}</div>
    ${g.speak.qs.map((q,k)=>`<div class="rv"><b>No. ${q.n}</b><p class="en" style="font-size:15px">${esc(q.q)}${q.follow?`<br><span class="muted" style="font-size:13px">${esc(q.follow)}</span>`:""}</p>
      <div class="model">解答例：${esc(q.a)}</div>
      <div class="selfrate" data-q="${k}">${[["ok","答えられた"],["mid","一部言えた"],["ng","言えなかった"]].map(([v,l])=>`<button aria-pressed="${S.self[k]===v}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}
    <p class="note">${g.speak.tip}</p>
  </div></details>`:""}
  ${inS("listen")?`<details ${S.scope==="listen"?"open":""}><summary>リスニング：答え合わせ</summary><div class="dbody">
    ${g.listen.map((it,k)=>rv(it,S.la[k],`第${it.part}部 No. ${k+1}`,`<div class="mine" style="font-size:14px">${scriptHTML(it)}</div>${it.read?"":`<p class="en" style="font-size:14px">${it.opts.map((o,j)=>`${j+1}. ${esc(o)}`).join("　")}</p>`}`)).join("")}
  </div></details>`:""}
  ${inS("read")?`<details ${S.scope==="read"?"open":""}><summary>リーディング：答え合わせ</summary><div class="dbody">
    ${Object.keys(g.pas).map(k=>`<div>${passageHTML(k)}</div>`).join("")}
    ${g.read.map((it,k)=>rv(it,S.ra[k],`大問${it.part} (${k+1})`,`<p class="en" style="font-size:15px">${stemOf(it)}</p><p class="en" style="font-size:14px">${it.opts.map((o,j)=>`${j+1}. ${esc(o)}`).join("　")}</p>`)).join("")}
  </div></details>`:""}
  ${inS("write")?`<details ${S.started.rw?"open":""}><summary>ライティング：あなたの解答と解答例</summary><div class="dbody">
    ${g.write.map((w,k)=>`<div class="rv"><b>${w.label}</b><div class="passage"><p class="en" style="font-size:14px">${w.prompt}</p></div>
      <div class="mine">${S.wa[k].trim()?esc(S.wa[k]):"（未記入）"}</div>
      <span class="wc"><span>語数 <b>${wN[k]}</b> 語（目安 ${w.min}〜${w.max}語）</span></span>
      <div class="model">解答例：${esc(w.model)}</div></div>`).join("")}
    <div id="aibox"></div>
  </div></details>`:""}
  <div class="row"><button class="btn primary" id="again">${g.label}${S.scope==="all"?"":"・"+SCOPES.find(x=>x[0]===S.scope)[1]}をもう一度受験する</button><button class="btn" id="hm">トップに戻る（級を選び直す）</button></div>`;
  main.querySelectorAll(".selfrate").forEach(gr=>gr.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.self[gr.dataset.q]=b.dataset.v;gr.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const ss=$("#selfsum");if(ss)ss.textContent=`${Object.values(S.self).filter(v=>v==="ok").length} / ${g.speak.qs.length}`;
  }));
  $("#again").onclick=()=>{resetAll();go("intro",{sec:firstSec()})};
  $("#hm").onclick=()=>{resetAll();go("home")};
  setupAI();
}
function passageTitle(key){const p=G().pas[key];return p.title?`“${p.title}”`:"Eメール"}

/* ===================== AI添削（使える環境のみ） ===================== */
let samplerP=null;
function getSampler(){if(!samplerP)samplerP=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);return samplerP}
async function setupAI(){
  if(!$("#aibox"))return;
  if(S.ai){$("#aibox").innerHTML=S.ai;return}
  const sample=await getSampler();if(!sample||!$("#aibox"))return;
  const g=G();
  if(!S.wa.some(t=>t.trim())){$("#aibox").innerHTML=`<p class="note">ライティングに記入するとAI添削が使えます。</p>`;return}
  $("#aibox").innerHTML=`<div class="ai"><b>AI添削</b><p style="font-size:14px">英検${g.label}の採点観点に沿って、あなたの英文にコメントします。</p><div class="row"><button class="btn primary" id="aig">添削してもらう</button></div></div>`;
  $("#aig").onclick=async()=>{
    const b=$("#aig");b.disabled=true;b.textContent="添削中…";
    const task=g.write.map((w,k)=>({type:w.label,task:w.plain,range:`${w.min}-${w.max} words`,answer:S.wa[k].trim()||"(no answer)"}));
    const prompt=`あなたは英検${g.label}ライティングの採点者です。${g.audience}の解答を、英検${g.label}の観点で採点・添削してください。
${g.rubric}
語数が目安から大きく外れている場合や、問いに答えていない場合は内容を減点。未解答は全て0点。
コメントは受験者にわかる日本語で、良い点1つと直すべき点を具体的に。直した英文も示す。
次のJSONだけを返す: {"results":[{"type":"…","scores":{"観点名":点数},"max":満点合計,"good":"…","fix":["…"],"revised":"英文"}]}
解答: ${JSON.stringify(task)}`;
    try{
      const out=await sample.json(prompt,{modelTier:"default"});
      const rs=(out&&out.results)||[];
      const html=`<div class="ai"><b>AI添削の結果</b>${rs.map(r=>{const sc=r.scores||{};const tot=Object.values(sc).reduce((a,c)=>a+(+c||0),0);
        return `<div class="rv"><b>${esc(r.type||"")}　${tot} / ${esc(r.max??"")}</b>
          <table>${Object.entries(sc).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>
          ${r.good?`<p style="font-size:14px">◎ ${esc(r.good)}</p>`:""}${(r.fix||[]).map(f=>`<p style="font-size:14px">△ ${esc(f)}</p>`).join("")}
          ${r.revised?`<div class="model">${esc(r.revised)}</div>`:""}</div>`}).join("")}
        <p class="note">AIによる目安の採点です。本番の採点とは異なる場合があります。</p></div>`;
      S.ai=html;if($("#aibox"))$("#aibox").innerHTML=html;
    }catch(e){
      if(e&&e.code==="not_granted"){$("#aibox").innerHTML="";return}
      b.disabled=false;b.textContent="もう一度試す";
      const m=document.createElement("p");m.className="note";m.textContent=e&&e.code==="rate_limited"?"混み合っています。少し時間をおいてから試してください。":"添削を取得できませんでした。もう一度試してください。";
      b.parentElement.after(m);
    }
  };
}

render();
</script>
