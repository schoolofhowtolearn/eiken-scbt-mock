function introLines(){
  const g=G();
  if(S.sec==="speak")return["本番の音源で、面接委員が英語で指示や質問をします。",`問題カード${g.speak.card}のパッセージを20秒間黙読したあと、音読します。続いて質問No.1〜No.${g.speak.qs.length}に答えます。`,"マイクのアイコンが<b>赤色</b>になっている間が解答時間（録音中）です。赤くなる前に話し始めないでください。","解答時間が終わると自動で次に進みます。質問を聞き逃したときは「もう一度聞く」を押せますが、本番では評価に影響する場合があります。"];
  if(S.sec==="listen")return[`全${g.listen.length}問、第1部〜第${Object.keys(g.listen_parts).length}部です。各部の最初に説明の音声が流れます（「説明をとばす」で省略できます）。`,"解答時間が終わると自動で次の問題に進み、前の問題には戻れません。","選択肢が放送される問題は、画面には番号だけが表示されます。"];
  const both=S.scope==="all";
  return[S.mode==="free"?"制限時間はありません。経過時間が表示されます。":`制限時間は<b>${both?"リーディングとライティング合わせて":""}${limitMin()}分</b>です。${both?"時間配分は自由です。":""}`,
    ...(S.scope!=="write"?[`リーディングは全${g.read.length}問です。`]:[]),...(S.scope!=="read"?[g.writeDesc]:[]),
    "「問題一覧」から、どの問題にも移動できます。後で確認したい問題は「見直し」を押すと印がつきます。",
    ...(S.scope!=="read"?["ライティングはキーボードで入力します。スペルチェック機能はありません。"]:[]),
    "すべて終わったら、問題一覧の「解答を終了する」を押してください。"+(S.mode==="free"?"":"時間になると自動で終了します。")];
}
function intro(){
  head(null);
  const t=secs().find(s=>s[0]===S.sec)[1]+"テスト";
  main.innerHTML=`<section class="panel stack"><h1>${t}</h1><ol style="margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px">${introLines().map(l=>`<li>${l}</li>`).join("")}</ol></section>`;
  tool(`<span class="msg">準備ができたら「開始」を押してください</span><div class="grp"><button class="btn primary" id="go">開始</button></div>`);
  $("#go").onclick=()=>{if(S.sec==="rw"){S.end=Date.now()+limitMin()*60000;S.elapsed=0}go(S.sec,{i:0})};
  $("#go").focus();
}

/* ===================== スピーキング ===================== */
const MIC='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
function interviewer(){return `<svg viewBox="0 0 300 225" aria-hidden="true"><rect width="300" height="225" fill="#d9dee6"/><rect y="150" width="300" height="75" fill="#b9a68a"/><rect x="30" y="30" width="70" height="90" fill="#c9d3df" stroke="#aab4c2"/><path d="M95 225 q0 -62 55 -66 q55 4 55 66z" fill="#34495e"/><path d="M136 160 l14 22 l14 -22z" fill="#f4f4f4"/><rect x="140" y="140" width="20" height="22" fill="#e8bf9c"/><ellipse cx="150" cy="112" rx="30" ry="36" fill="#f0c9a6"/><path d="M120 108 q2 -42 30 -42 q30 0 30 42 q-4 -24 -30 -26 q-24 2 -30 26z" fill="#3a2e28"/><circle cx="139" cy="110" r="3" fill="#2b2b2b"/><circle cx="161" cy="110" r="3" fill="#2b2b2b"/><ellipse class="mouth" cx="150" cy="129" rx="7.5" ry="1.2" fill="#7a2f2a"/><rect x="200" y="182" width="60" height="6" fill="#8d7a60"/></svg>`}
function steps(){const sp=G().speak;return[{lab:"黙読・音読",f:sp.instruct,card:"front",ph:sp.instructPh},...sp.qs.map((q,k)=>({lab:`No. ${q.n}`,f:q.f,card:q.card,ph:q.ph,qk:k,follow:q.follow}))]}
function cardHTML(kind){
  const sp=G().speak;
  if(kind==="back")return `<div class="qcard"><div class="back">（問題カードは裏返しです）<br>あなた自身の考えを答えてください</div></div>`;
  const pics=sp.imgs.length>1?`<div class="pics">${sp.imgs.map(([l,s])=>`<figure><figcaption>${l}</figcaption><img src="${s}" alt="イラスト${l}"></figure>`).join("")}</div>`:`<img class="cardimg" src="${sp.imgs[0][1]}" alt="問題カードのイラスト">`;
  return `<div class="qcard"><div class="cardno">問題カード${sp.card}</div><h3>${sp.title}</h3><p class="en">${sp.passage}</p>${sp.opening?`<div class="opening">Your story should begin with this sentence: <b>${sp.opening}</b></div>`:""}${pics}</div>`;
}
function speak(){
  const SS=steps(),st=SS[S.i],run=++S.run;head(null);
  main.innerHTML=`<div><div class="qbar"><b id="slab">${st.lab}</b><span class="qn">${S.i+1} / ${SS.length}</span></div>
    <div class="qframe"><div class="spk">
      <div class="stack" style="gap:10px">
        <div class="video" id="vid">${interviewer()}</div>
        <div class="recbox"><div class="mic" id="mic">${MIC}</div><div><div class="lbl" id="lbl">待機中</div><div class="muted" style="font-size:12px" id="sub">面接委員の話を聞いてください</div></div><div class="cd" id="cd"></div></div>
        <div class="bar-m" id="bm"><i id="bmi"></i></div>
        <p class="note" id="err" hidden></p>
      </div>
      <div>${cardHTML(st.card)}</div>
    </div></div></div>`;
  const repN=S.rep[S.i]||0;
  tool(`<span class="msg">録音のやり直しはできません</span><div class="grp">${st.qk!=null?`<button class="btn warn" id="rep">もう一度聞く${repN?`（${repN}回使用）`:""}</button>`:""}<button class="btn primary" id="nx" disabled>次へ</button></div>`);
  const mic=$("#mic"),lb=$("#lbl"),sub=$("#sub"),cd=$("#cd"),bm=$("#bm"),bmi=$("#bmi"),vid=$("#vid"),nx=$("#nx"),slab=$("#slab");
  const next=()=>{if(run!==S.run)return;stopAudio();if(S.i<SS.length-1)go("speak",{i:S.i+1});else{S.done.speak=true;S.scope==="all"?go("intro",{sec:"listen"}):go("result")}};
  nx.onclick=next;
  if($("#rep"))$("#rep").onclick=()=>{S.rep[S.i]=(S.rep[S.i]||0)+1;go("speak",{i:S.i})};
  let last="";
  const onTime=t=>{
    if(run!==S.run)return;
    const p=st.ph.find(x=>t>=x[0]&&t<x[1]);const mode=p?p[2]:"talk";
    if(mode!==last){last=mode;
      mic.classList.toggle("on",mode==="rec");bm.classList.toggle("on",mode==="rec");lb.classList.toggle("on",mode==="rec");
      lb.textContent=mode==="rec"?"録音中":mode==="prep"?"準備時間":"再生中";
      sub.textContent=mode==="rec"?(st.qk==null?"パッセージを音読してください":"英語で答えてください"):mode==="prep"?(st.qk==null?"パッセージを黙読してください":"カードを見て準備してください"):"面接委員の話を聞いてください";
      if(st.qk==null)slab.textContent=mode==="rec"?"音読":mode==="prep"?"黙読":"黙読・音読";
      nx.disabled=mode!=="rec";if(mode==="talk"){cd.textContent="";bmi.style.width="0%";head(null)}
    }
    if(p){const left=Math.max(0,Math.ceil(p[1]-t)),tot=p[1]-p[0];cd.textContent=left;bmi.style.width=((t-p[0])/tot*100)+"%";head(left,mode==="rec"?"解答時間":"準備時間")}
  };
  // 口の動き：音源の音量（20コマ/秒）に合わせて開閉する
  const env=G().speak.env[st.f]||"",mouth=vid.querySelector(".mouth");let cur=0;
  const lip=()=>{if(run!==S.run)return;
    let target=0;
    if(!AU.paused&&env){const i=Math.floor((AU.currentTime+0.03)*20);target=+(env[i]||0)}
    cur+= (target-cur)*(target>cur?0.6:0.35);
    mouth.setAttribute("ry",(1.2+cur*0.6).toFixed(2));mouth.setAttribute("rx",(7.5-cur*0.15).toFixed(2));
    requestAnimationFrame(lip)};
  requestAnimationFrame(lip);
  setTimeout(()=>{if(run!==S.run)return;play(st.f,{onTime,onEnd:next,onErr:(why)=>{const e=$("#err");e.hidden=false;e.innerHTML=why==="blocked"?"音声の再生がブラウザに止められました。画面のどこかをクリックしてから「もう一度聞く」を押してください。":"音源ファイルを読み込めませんでした。「次へ」で先に進めます。";nx.disabled=false}})},300);
}

/* ===================== リスニング ===================== */
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>';
function listen(){
  const L=G().listen,it=L[S.i],run=++S.run;head(null);
  const pt=G().listen_parts[it.part];
  const errFn=why=>{const e=$("#err");if(e){e.hidden=false;e.innerHTML=why==="blocked"?"音声の再生がブラウザに止められました。画面をクリックしてからもう一度お試しください。":"音源ファイルを読み込めませんでした。「次へ」で先に進めます。"}const n=$("#nx");if(n)n.disabled=false};
  // 各部の最初：説明音声
  const firstOfPart=L.findIndex(x=>x.part===it.part)===S.i;
  if(firstOfPart&&!S.explDone[it.part]){
    main.innerHTML=`<div><div class="qbar"><b>第${it.part}部</b><span class="qn">説明</span></div><div class="qframe">
      <p class="direc">${pt.dir}</p>
      <div class="lstage"><div class="spk-ic on">${SPK}</div><span class="lbl">説明の放送中</span><div class="bar-m"><i id="bmi"></i></div></div>
      <p class="note" id="err" hidden></p></div></div>`;
    tool(`<span class="msg">説明のあと、No.${S.i+1}が始まります</span><div class="grp"><button class="btn primary" id="nx">説明をとばす</button></div>`);
    const done=()=>{if(run!==S.run)return;S.explDone[it.part]=true;go("listen",{i:S.i})};
    $("#nx").onclick=done;
    setTimeout(()=>{if(run!==S.run)return;play(pt.expl,{onTime:t=>{const b=$("#bmi");if(b&&AU.duration)b.style.width=(t/AU.duration*100)+"%"},onEnd:done,onErr:errFn})},300);
    return;
  }
  const sel=S.la[S.i];
  main.innerHTML=`<div><div class="qbar"><b>第${it.part}部</b><span class="qn">No. ${S.i+1}　（${S.i+1} / ${L.length}）</span></div>
    <div class="qframe">
      <p class="direc">${pt.dir}</p>
      <div class="lstage"><div class="spk-ic" id="ic">${SPK}</div><span class="lbl" id="lbl">放送を待っています</span><div class="bar-m"><i id="bmi"></i></div></div>
      <p class="note" id="err" hidden></p>
      ${it.pic?`<img class="lpic" src="${it.pic}" alt="No.${S.i+1}のイラスト">`:""}
      <div class="qstem"><span class="no">No. ${S.i+1}</span>${it.read?`<span class="muted" style="font-size:14px;line-height:1.8">選択肢は放送されます。</span>`:""}</div>
      <div class="opts ${it.read?"inline":""}" role="radiogroup" aria-label="解答">
        ${(it.read?Array.from({length:it.n},(_,k)=>null):it.opts).map((o,k)=>`<button class="opt" role="radio" aria-checked="${sel===k}" data-k="${k}"><span class="rd"></span><span class="k">${k+1}</span>${o==null?"":`<span class="t">${esc(o)}</span>`}</button>`).join("")}
      </div>
    </div></div>`;
  tool(`<span class="msg">解答時間が終わると自動で次の問題に進みます。前の問題には戻れません。</span><div class="grp"><button class="btn primary" id="nx" disabled>次へ</button></div>`);
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.la[S.i]=+b.dataset.k;main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b))});
  const next=()=>{if(run!==S.run)return;stopAudio();if(S.i<L.length-1)go("listen",{i:S.i+1});else{S.done.listen=true;S.scope==="all"?go("intro",{sec:"rw"}):go("result")}};
  $("#nx").onclick=next;
  const ic=$("#ic"),lb=$("#lbl"),bmi=$("#bmi");let last="";
  setTimeout(()=>{if(run!==S.run)return;play(it.f,{onEnd:next,onErr:errFn,onTime:t=>{
    if(run!==S.run)return;const ans=t>=it.a0&&t<it.a1;const mode=ans?"ans":t>=it.a1?"after":"play";
    if(mode!==last){last=mode;ic.classList.toggle("on",mode==="play");lb.textContent=mode==="ans"?"解答してください":mode==="play"?"放送中":"放送中";$("#nx").disabled=mode!=="ans"}
    if(ans){const left=Math.ceil(it.a1-t);head(left,"解答時間");bmi.style.width=((t-it.a0)/(it.a1-it.a0)*100)+"%"}
    else if(mode==="play"){bmi.style.width=(t/it.a0*100)+"%";head(null)}
  }})},300);
}

/* ===================== リーディング・ライティング ===================== */
function answered(n){const x=RW()[n];return x.t==="r"?S.ra[x.k]!=null:wcount(S.wa[x.k])>0}
function flagged(n){const x=RW()[n];return x.t==="r"?!!S.rf[x.k]:!!S.wf[x.k]}
function rwTimer(){
  if(S.mode==="free"){startClock(s=>head(s,"経過時間"));return}
  const left=Math.max(0,Math.ceil((S.end-Date.now())/1000));
  startTimer(left,()=>{S.done.rw=true;go("result")},l=>head(l,"残り時間"));
}
function rw(){
  S.run++;if(S.ov)return overview();
  const R=RW(),x=R[S.i];if(x.t==="r")readQ(x.k);else writeQ(x.k);
  tool(`<div class="grp"><button class="btn" id="ovb">問題一覧</button><button class="btn flag" id="fl" aria-pressed="${flagged(S.i)}">見直し</button></div>
    <div class="grp"><button class="btn" id="pv" ${S.i===0?"disabled":""}>前へ</button><button class="btn primary" id="nx">${S.i<R.length-1?"次へ":"問題一覧へ"}</button></div>`);
  $("#ovb").onclick=()=>{S.ov=true;rw()};
  $("#fl").onclick=()=>{const x=RW()[S.i];if(x.t==="r")S.rf[x.k]=!S.rf[x.k];else S.wf[x.k]=!S.wf[x.k];$("#fl").setAttribute("aria-pressed",flagged(S.i))};
  $("#pv").onclick=()=>{S.i--;rw();window.scrollTo(0,0)};
  $("#nx").onclick=()=>{if(S.i<R.length-1)S.i++;else S.ov=true;rw();window.scrollTo(0,0)};
  if(!tick)rwTimer();
}
function passageHTML(key){
  const p=G().pas[key];
  let h=`<div class="passage">${p.head?`<div class="mail-h">${p.head}</div>`:""}${p.title?`<h4>${p.title}</h4>`:""}<p class="en" style="font-size:16px">${p.body}</p>${p.notes?`<p class="pnotes">${p.notes}</p>`:""}</div>`;
  if(p.body2)h+=`<div class="passage" style="margin-top:10px"><div class="mail-h">${p.head2}</div><p class="en" style="font-size:16px">${p.body2}</p></div>`;
  return h;
}
const qno=k=>`(${k+1})`;
function readQ(k){
  const it=G().read[k];
  const stem=it.blank?`<div class="qstem"><span class="no">${qno(k)}</span><p style="min-width:0;line-height:1.8">本文の空所 <span class="blank">(${it.blank})</span> に入れるのに最も適切なもの</p></div>`:`<div class="qstem"><span class="no">${qno(k)}</span><p class="en" style="min-width:0">${it.q}</p></div>`;
  const opts=`<div class="opts" role="radiogroup" aria-label="${qno(k)}の解答">${it.o.map((o,j)=>`<button class="opt" role="radio" aria-checked="${S.ra[k]===j}" data-k="${j}"><span class="rd"></span><span class="k">${j+1}</span><span class="t">${esc(o)}</span></button>`).join("")}</div>`;
  main.innerHTML=`<div><div class="qbar"><b>リーディング　大問${it.p}</b><span class="qn">${qno(k)}　問題 ${S.i+1} / ${RW().length}</span></div>
    <div class="qframe"><p class="direc">${G().rdir[it.p]}</p>
      ${it.pas?`<div class="split"><div class="pane scroll">${passageHTML(it.pas)}</div><div class="pane stack">${stem}${opts}</div></div>`:`${stem}${opts}`}
    </div></div>`;
  main.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{S.ra[k]=+b.dataset.k;main.querySelectorAll(".opt").forEach(x=>x.setAttribute("aria-checked",x===b))});
}
function writeQ(k){
  const it=G().write[k];
  main.innerHTML=`<div><div class="qbar"><b>ライティング　${it.label}</b><span class="qn">問題 ${S.i+1} / ${RW().length}</span></div>
    <div class="qframe"><p class="direc">${it.instr}</p>${it.note?`<p class="note">${it.note}</p>`:""}
      <div class="split">
        <div class="pane scroll"><div class="passage"><p class="en" style="font-size:16px">${it.prompt}</p></div></div>
        <div class="pane stack" style="gap:8px">
          ${it.before?`<p class="en" style="font-size:16px">${it.before}</p>`:""}
          <label for="ta${k}" class="muted" style="font-size:13px">解答欄</label>
          <textarea id="ta${k}" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off">${esc(S.wa[k])}</textarea>
          ${it.after?`<p class="en" style="font-size:16px">${it.after}</p>`:""}
          <div class="wc" id="wc"></div>
        </div></div></div></div>`;
  const ta=$("#ta"+k),wc=$("#wc");
  const upd=()=>{wc.innerHTML=`<span>語数：<b>${wcount(ta.value)}</b>語</span><span>語数の目安 ${it.min}語～${it.max}語</span>`};
  ta.oninput=()=>{S.wa[k]=ta.value;upd()};upd();
}
function overview(){
  const R=RW(),un=R.filter((_,n)=>!answered(n)).length,fl=R.filter((_,n)=>flagged(n)).length;
  const card=n=>{const x=R[n];const lab=x.t==="r"?`大問${G().read[x.k].p}`:`ライティング ${G().write[x.k].label}`;
    return `<button class="ov ${answered(n)?"ans":""} ${flagged(n)?"flg":""}" data-g="${n}"><b>${x.t==="r"?qno(x.k):`W${x.k+1}`}</b><span>${lab}</span><span class="st">${answered(n)?"解答済み":"未解答"}</span></button>`};
  main.innerHTML=`<section class="panel stack"><h2>問題一覧</h2>
    <div class="legend"><span>未解答：${un}問</span><span>見直し：${fl}問</span><span>番号を押すとその問題に移動します</span></div>
    ${S.scope!=="write"?`<b style="font-size:14px">リーディング</b><div class="ovgrid">${R.map((x,n)=>x.t==="r"?card(n):"").join("")}</div>`:""}
    ${S.scope!=="read"?`<b style="font-size:14px">ライティング</b><div class="ovgrid">${R.map((x,n)=>x.t==="w"?card(n):"").join("")}</div>`:""}
    ${S.cf?`<div class="dialog" role="alertdialog" aria-labelledby="cft"><b id="cft">解答を終了しますか？</b><p style="font-size:14px">${un?`未解答の問題が${un}問あります。`:""}${fl?`見直しの印がついた問題が${fl}問あります。`:""}終了すると、この試験には戻れません。</p><div class="row"><button class="btn primary" id="cfY">終了する</button><button class="btn" id="cfN">キャンセル</button></div></div>`:""}
  </section>`;
  main.querySelectorAll(".ov").forEach(b=>b.onclick=()=>{S.i=+b.dataset.g;S.ov=false;S.cf=false;rw()});
  tool(`<div class="grp"><button class="btn" id="bk">問題に戻る</button></div><div class="grp"><button class="btn primary" id="endb">解答を終了する</button></div>`);
  $("#bk").onclick=()=>{S.ov=false;S.cf=false;rw()};
  $("#endb").onclick=()=>{S.cf=true;rw();$("#cfY").focus()};
  if($("#cfY")){$("#cfY").onclick=()=>{S.done.rw=true;go("result")};$("#cfN").onclick=()=>{S.cf=false;rw()}}
  if(!tick)rwTimer();
}

/* ===================== 結果 ===================== */
function result(){
  S.sec=null;head(null);tool(null);chrome();
  const g=G();
  const lc=g.listen.filter((x,k)=>S.la[k]===x.ans).length,rc=g.read.filter((x,k)=>S.ra[k]===x.ans).length;
  const selfN=Object.values(S.self).filter(v=>v==="ok").length,wN=g.write.map((_,k)=>wcount(S.wa[k]));
  const reps=Object.values(S.rep).reduce((a,b)=>a+b,0);const na='<b class="na">未受験</b>';
  const mark=(ok)=>`<span class="tag ${ok?"ok":"ng"}">${ok?"正解":"不正解"}</span>`;
  const byPart=(arr,key)=>{const m={};arr.forEach((x,k)=>{const p=x[key];(m[p]=m[p]||[0,0]);m[p][1]++;if((key==="part"?S.la[k]:S.ra[k])===x.ans)m[p][0]++});return Object.entries(m).map(([p,[a,b]])=>`<span>${key==="part"?"第"+p+"部":"大問"+p}：${a}/${b}</span>`).join("")};
  main.innerHTML=`<section class="panel stack">
    <div class="row"><h1>${S.name?esc(S.name)+"さん、":""}おつかれさまでした</h1>${S.aborted?'<span class="stopped">途中で中止</span>':""}</div>
    <p class="muted">${g.label}　${g.title}　${S.scope==="all"?"模擬試験":SCOPES.find(x=>x[0]===S.scope)[1]}の結果</p>
    <div class="sum">
      ${inS("listen")?`<div><span>リスニング</span>${S.started.listen?`<b>${lc} / ${g.listen.length}</b><small class="bp">${byPart(g.listen,"part")}</small>`:na}</div>`:""}
      ${inS("read")?`<div><span>リーディング</span>${S.started.rw?`<b>${rc} / ${g.read.length}</b><small class="bp">${byPart(g.read,"p")}</small>`:na}</div>`:""}
      ${inS("write")?`<div><span>ライティング 語数</span>${S.started.rw?`<b>${wN.join("・")}</b>`:na}</div>`:""}
      ${inS("speak")?`<div><span>スピーキング 自己評価</span>${S.started.speak?`<b id="selfsum">${selfN} / ${g.speak.qs.length}</b>`:na}</div>`:""}
    </div>
    <p class="note">本番はCSEスコアで合否が判定されます。この模擬の正答数はスコアに換算していません。詳しい解説は過去問集の解答冊子（${g.title}）を見てください。${S.aborted?"途中で中止したため、受験していない問題は未解答として扱っています。":""}${reps?`スピーキングで「もう一度聞く」を${reps}回使いました。本番では評価に影響する場合があります。`:""}</p>
  </section>
  ${inS("speak")?`<details ${S.started.speak?"open":""}><summary>スピーキング：解答例と自己評価</summary><div class="dbody">
    <div>${cardHTML("front")}</div>
    <div class="row"><button class="btn" data-play="${g.speak.model}">音読のお手本を聞く</button></div>
    ${g.speak.qs.map((q,k)=>`<div class="rv"><div class="row"><b>No. ${q.n}</b><button class="btn sm" data-play="${q.f}">質問を聞く</button></div><p class="en" style="font-size:15px">${esc(q.q)}${q.follow?`<br><span class="muted" style="font-size:13px">${esc(q.follow)}</span>`:""}</p>
      <div class="model">解答例：${esc(q.a)}</div>
      <div class="selfrate" data-q="${k}">${[["ok","答えられた"],["mid","一部言えた"],["ng","言えなかった"]].map(([v,l])=>`<button aria-pressed="${S.self[k]===v}" data-v="${v}">${l}</button>`).join("")}</div></div>`).join("")}
    <p class="note">${g.speak.tip}</p></div></details>`:""}
  ${inS("listen")?`<details ${S.scope==="listen"?"open":""}><summary>リスニング：答え合わせ</summary><div class="dbody">
    ${g.listen.map((it,k)=>`<div class="rv"><div class="row">${mark(S.la[k]===it.ans)}<b>第${it.part}部 No. ${k+1}</b><span class="muted" style="font-size:13px">あなたの解答：${S.la[k]==null?"未解答":S.la[k]+1}　正解：${it.ans+1}</span><button class="btn sm" data-play="${it.f}">音声を聞く</button></div>
      ${it.read?"":`<p class="en" style="font-size:14px">${it.opts.map((o,j)=>`<span class="${j===it.ans?"ca":""}">${j+1}. ${esc(o)}</span>`).join("　")}</p>`}</div>`).join("")}
  </div></details>`:""}
  ${inS("read")?`<details ${S.scope==="read"?"open":""}><summary>リーディング：答え合わせ</summary><div class="dbody">
    ${g.read.map((it,k)=>`<div class="rv"><div class="row">${mark(S.ra[k]===it.ans)}<b>大問${it.p} ${qno(k)}</b><span class="muted" style="font-size:13px">あなたの解答：${S.ra[k]==null?"未解答":S.ra[k]+1}　正解：${it.ans+1}</span></div>
      <p class="en" style="font-size:15px">${it.blank?`本文の空所 (${it.blank})`:it.q}</p><p class="en" style="font-size:14px">${it.o.map((o,j)=>`<span class="${j===it.ans?"ca":""}">${j+1}. ${esc(o)}</span>`).join("　")}</p></div>`).join("")}
    <details class="inner"><summary>本文を表示</summary><div class="dbody">${Object.keys(g.pas).map(passageHTML).join("")}</div></details>
  </div></details>`:""}
  ${inS("write")?`<details ${S.started.rw?"open":""}><summary>ライティング：あなたの解答と解答例</summary><div class="dbody">
    ${g.write.map((w,k)=>`<div class="rv"><b>${w.label}</b><div class="passage"><p class="en" style="font-size:14px">${w.prompt}</p></div>
      <div class="mine">${S.wa[k].trim()?esc(S.wa[k]):"（未記入）"}</div>
      <span class="wc"><span>語数 <b>${wN[k]}</b> 語（目安 ${w.min}〜${w.max}語）</span></span>
      <div class="model">解答例：${esc(w.model)}</div></div>`).join("")}
    <div id="aibox"></div></div></details>`:""}
  <div class="row"><button class="btn primary" id="again">${g.label}${S.scope==="all"?"":"・"+SCOPES.find(x=>x[0]===S.scope)[1]}をもう一度受験する</button><button class="btn" id="hm">トップに戻る</button></div>`;
  main.querySelectorAll(".selfrate").forEach(gr=>gr.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.self[gr.dataset.q]=b.dataset.v;gr.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));
    const ss=$("#selfsum");if(ss)ss.textContent=`${Object.values(S.self).filter(v=>v==="ok").length} / ${g.speak.qs.length}`;
  }));
  main.querySelectorAll("[data-play]").forEach(b=>b.onclick=()=>{
    if(b.classList.contains("playing")){stopAudio();b.classList.remove("playing");return}
    main.querySelectorAll(".playing").forEach(x=>x.classList.remove("playing"));b.classList.add("playing");
    play(b.dataset.play,{onEnd:()=>b.classList.remove("playing"),onErr:()=>b.classList.remove("playing")});
  });
  $("#again").onclick=()=>{stopAudio();resetAll();go("intro",{sec:firstSec()})};
  $("#hm").onclick=()=>{stopAudio();resetAll();go("home")};
  setupAI();
}

/* ===================== AI添削（Claudeのページで開いたときだけ） ===================== */
let samplerP=null;
function getSampler(){if(!samplerP)samplerP=(window.claude&&window.claude.use)?window.claude.use("sample").catch(()=>null):Promise.resolve(null);return samplerP}
async function setupAI(){
  if(!$("#aibox"))return;if(S.ai){$("#aibox").innerHTML=S.ai;return}
  const sample=await getSampler();if(!sample||!$("#aibox"))return;
  const g=G();if(!S.wa.some(t=>t.trim()))return;
  $("#aibox").innerHTML=`<div class="ai"><b>AI添削</b><p style="font-size:14px">英検${g.label}の採点観点に沿って、あなたの英文にコメントします。</p><div class="row"><button class="btn primary" id="aig">添削してもらう</button></div></div>`;
  $("#aig").onclick=async()=>{
    const b=$("#aig");b.disabled=true;b.textContent="添削中…";
    const task=g.write.map((w,k)=>({type:w.label,task:w.plain,range:`${w.min}-${w.max} words`,answer:S.wa[k].trim()||"(no answer)"}));
    const prompt=`あなたは英検${g.label}ライティングの採点者です。${g.audience}の解答を、英検${g.label}の観点で採点・添削してください。\n${g.rubric}\n語数が目安から大きく外れている場合や、問いに答えていない場合は内容を減点。未解答は全て0点。\nコメントは受験者にわかる日本語で、良い点1つと直すべき点を具体的に。直した英文も示す。\n次のJSONだけを返す: {"results":[{"type":"…","scores":{"観点名":点数},"max":満点合計,"good":"…","fix":["…"],"revised":"英文"}]}\n解答: ${JSON.stringify(task)}`;
    try{
      const out=await sample.json(prompt,{modelTier:"default"});const rs=(out&&out.results)||[];
      const html=`<div class="ai"><b>AI添削の結果</b>${rs.map(r=>{const sc=r.scores||{};const tot=Object.values(sc).reduce((a,c)=>a+(+c||0),0);
        return `<div class="rv"><b>${esc(r.type||"")}　${tot} / ${esc(r.max??"")}</b><table>${Object.entries(sc).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join("")}</table>${r.good?`<p style="font-size:14px">◎ ${esc(r.good)}</p>`:""}${(r.fix||[]).map(f=>`<p style="font-size:14px">△ ${esc(f)}</p>`).join("")}${r.revised?`<div class="model">${esc(r.revised)}</div>`:""}</div>`}).join("")}<p class="note">AIによる目安の採点です。</p></div>`;
      S.ai=html;if($("#aibox"))$("#aibox").innerHTML=html;
    }catch(e){if(e&&e.code==="not_granted"){$("#aibox").innerHTML="";return}b.disabled=false;b.textContent="もう一度試す"}
  };
}
render();

</script>
