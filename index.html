<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>英検S-CBT模擬試験（過去問）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout (past-exam edition): CBT terminal — fixed exam header (級・技能・受験者・残り時間・中止), working area, fixed bottom toolbar. */
:root{
  --bg:#e4e8ee; --surface:#ffffff; --sunk:#f2f4f7; --ink:#1a2230; --muted:#5a6476; --line:#c4ccd8; --line2:#9aa6b8;
  --bar:#24466f; --bar2:#1a3554; --bar-ink:#f2f5fa; --tool:#d7dde6; --tool-ink:#1a2230;
  --accent:#d08a1e; --accent-soft:#fcefd6; --rec:#d23b3b; --rec-soft:#fbe3e3;
  --ok:#2c7a4b; --ok-soft:#e1f1e7; --ng:#b03a3a; --ng-soft:#f8e2e2; --sel:#1f5aa6; --sel-soft:#e1ebf8;
  --ill-skin:#f2c9a5; --ill-a:#3d7bc4; --ill-b:#d9534f; --ill-green:#6fa35a; --ill-wood:#c99a62; --ill-line:#2b3443; --ill-hair:#3a2e28; --ill-bg:#f8f5ee; --vid:#2f3d4f;
  --ui:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  --en:"Atkinson Hyperlegible","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#18202b; --sunk:#121922; --ink:#e5e9ef; --muted:#9aa5b6; --line:#2e3a4b; --line2:#4a5870;
  --bar:#1b3555; --bar2:#132840; --bar-ink:#e8eef7; --tool:#1f2935; --tool-ink:#e5e9ef;
  --accent:#e6a44a; --accent-soft:#3a2d17; --rec:#ef6b6b; --rec-soft:#3d1c1c;
  --ok:#5cbf85; --ok-soft:#183325; --ng:#e47b7b; --ng-soft:#3a1d1d; --sel:#7fb0ee; --sel-soft:#1b2c44;
  --ill-skin:#e0b48f; --ill-a:#5b93d6; --ill-b:#e06a66; --ill-green:#6f9f5c; --ill-wood:#a87d4c; --ill-line:#cfd7e3; --ill-hair:#6b5242; --ill-bg:#202a37; --vid:#0b1119; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#18202b; --sunk:#121922; --ink:#e5e9ef; --muted:#9aa5b6; --line:#2e3a4b; --line2:#4a5870;
  --bar:#1b3555; --bar2:#132840; --bar-ink:#e8eef7; --tool:#1f2935; --tool-ink:#e5e9ef;
  --accent:#e6a44a; --accent-soft:#3a2d17; --rec:#ef6b6b; --rec-soft:#3d1c1c;
  --ok:#5cbf85; --ok-soft:#183325; --ng:#e47b7b; --ng-soft:#3a1d1d; --sel:#7fb0ee; --sel-soft:#1b2c44;
  --ill-skin:#e0b48f; --ill-a:#5b93d6; --ill-b:#e06a66; --ill-green:#6f9f5c; --ill-wood:#a87d4c; --ill-line:#cfd7e3; --ill-hair:#6b5242; --ill-bg:#202a37; --vid:#0b1119; color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.in{max-width:1080px;margin:0 auto}

/* ---------- header ---------- */
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;color:var(--bar-ink)}
.bar1{background:var(--bar);padding-block:8px}
.bar1 .in{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.lv{font-weight:700;font-size:13px;border:1px solid rgba(255,255,255,.45);border-radius:3px;padding:2px 8px;white-space:nowrap}
.sec{font-weight:700;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{font-size:12px;opacity:.8;white-space:nowrap}
.tbox{display:flex;align-items:center;gap:8px;background:var(--bar2);border:1px solid rgba(255,255,255,.2);border-radius:4px;padding:3px 10px;min-width:9.5em;justify-content:space-between}
.tbox small{font-size:11px;opacity:.75;white-space:nowrap}
.tbox b{font-size:20px;font-variant-numeric:tabular-nums;letter-spacing:.02em}
.tbox.warn b{color:var(--accent)}
.abort{font:inherit;font-size:13px;font-weight:700;border:1px solid rgba(255,255,255,.55);background:transparent;color:var(--bar-ink);border-radius:3px;padding:4px 12px;cursor:pointer;min-height:34px}
.abort:hover{background:rgba(255,255,255,.12)}
.bar2{background:var(--bar2);padding-block:4px}
.bar2 .in{display:flex;gap:4px;flex-wrap:wrap;align-items:center;font-size:12px}
.bar2 span{padding:2px 10px;border-radius:2px;opacity:.55}
.bar2 span.on{background:var(--accent);color:#1b1305;opacity:1;font-weight:700}
.bar2 span.done{opacity:.85}
.bar2 span.done::before{content:"✓ "}
.vol{margin-left:auto;display:flex;align-items:center;gap:6px;opacity:.95}
.vol input{width:110px;accent-color:var(--accent)}

main{padding-block:16px 24px}
main.hasfoot{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
main>.in{display:flex;flex-direction:column;gap:14px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px clamp(16px,3vw,26px)}
h1{font-size:clamp(21px,3.6vw,28px);line-height:1.35;margin:0;text-wrap:balance}
h2{font-size:17px;margin:0;text-wrap:balance}
p{margin:0}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.en{font-family:var(--en);font-size:17px;line-height:1.8}
.note{font-size:13px;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.btn{font:inherit;font-weight:700;border:1px solid var(--line2);background:var(--surface);color:var(--ink);padding:9px 18px;border-radius:3px;cursor:pointer;min-height:44px;box-shadow:0 1px 0 var(--line)}
.btn:hover{background:var(--sunk)}
.btn.primary{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.warn{border-color:var(--accent)}
.btn.danger{border-color:var(--ng);color:var(--ng)}
.btn.flag[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input[type=text],select{font:inherit;padding:8px 12px;border:1px solid var(--line2);border-radius:3px;background:var(--sunk);color:var(--ink);max-width:100%}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (max-width:640px){.grid2{grid-template-columns:1fr}}
.grades{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.scopes{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scopes .gbtn b{font-size:16px}
.gbtn{font:inherit;text-align:left;border:1.5px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:4px;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.gbtn b{font-size:20px;line-height:1.3}
.gbtn span{font-size:12px;color:var(--muted)}
.gbtn:hover{background:var(--sunk)}
.gbtn[aria-checked="true"]{border-color:var(--sel);background:var(--sel-soft);box-shadow:inset 0 0 0 1px var(--sel)}
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.flow div{padding:12px 14px;border-right:1px solid var(--line);background:var(--sunk);min-width:0}
.flow div:last-child{border-right:0}
.flow b{display:block}
.flow span{font-size:12.5px;color:var(--muted);display:block;line-height:1.55}
.flow i{font-style:normal;font-size:11px;color:var(--accent);font-weight:700;letter-spacing:.1em}
@media (max-width:640px){.flow{grid-template-columns:1fr}.flow div{border-right:0;border-bottom:1px solid var(--line)}.flow div:last-child{border-bottom:0}}

/* ---------- question frame ---------- */
.qbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-bottom:0;border-radius:4px 4px 0 0;padding:8px 14px}
.qbar b{font-size:15px}
.qbar .qn{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.qframe{background:var(--surface);border:1px solid var(--line);border-radius:0 0 4px 4px;padding:18px clamp(14px,2.6vw,24px);display:flex;flex-direction:column;gap:14px}
.direc{font-size:14px;background:var(--sunk);border-left:4px solid var(--bar);padding:8px 12px}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:18px;align-items:start}
.split .pane{min-width:0}
@media (min-width:861px){.split .pane.scroll{max-height:calc(100vh - 290px);overflow:auto;padding-right:6px}}
@media (max-width:860px){.split{grid-template-columns:1fr}}
.passage{background:var(--surface);border:1px solid var(--line2);padding:14px 16px}
.passage h4{font-family:var(--en);text-align:center;margin:0 0 6px;font-size:17px}
.mail-h{font-family:var(--en);font-size:14px;color:var(--muted);border-bottom:1px solid var(--line);padding-bottom:8px;margin-bottom:10px;line-height:1.6}
.qstem{display:flex;gap:10px;align-items:flex-start}
.qstem .no{flex:none;font-weight:700;font-variant-numeric:tabular-nums;font-family:var(--en);font-size:17px;line-height:1.8}
.opts{display:flex;flex-direction:column;gap:6px}
.opt{display:flex;gap:12px;align-items:center;text-align:left;font:inherit;width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer;min-height:46px}
.opt:hover{background:var(--sunk)}
.opt .rd{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line2);display:grid;place-items:center}
.opt .rd::after{content:"";width:10px;height:10px;border-radius:50%;background:transparent}
.opt .k{flex:none;font-weight:700;width:1.2em;font-variant-numeric:tabular-nums}
.opt .t{font-family:var(--en);font-size:16.5px;min-width:0}
.opt[aria-checked="true"]{border-color:var(--sel);background:var(--sel-soft)}
.opt[aria-checked="true"] .rd{border-color:var(--sel)}
.opt[aria-checked="true"] .rd::after{background:var(--sel)}
.opts.inline{flex-direction:row;flex-wrap:wrap}
.opts.inline .opt{width:auto;flex:1 1 110px}
.blank{font-family:var(--en);font-weight:700;border-bottom:1.5px solid var(--ink);padding:0 6px}

/* ---------- fixed toolbar ---------- */
footer.tool{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--tool);color:var(--tool-ink);border-top:1px solid var(--line2);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
footer.tool .in{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
footer.tool .grp{display:flex;gap:8px;flex-wrap:wrap}
footer.tool .msg{font-size:12.5px;color:var(--muted)}

/* ---------- pause / abort dialog ---------- */
.ovl{position:fixed;inset:0;z-index:20;background:rgba(8,14,22,.6);display:grid;place-items:center;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
.ovl[hidden],.tbox[hidden]{display:none!important}
.dlg{background:var(--surface);color:var(--ink);border-radius:6px;border:1px solid var(--line);max-width:460px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg .col{display:flex;flex-direction:column;gap:8px}
.dlg .col .btn{width:100%}

/* ---------- overview ---------- */
.ovgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ov{font:inherit;text-align:left;border:1px solid var(--line2);background:var(--surface);color:var(--ink);border-radius:3px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative;min-width:0}
.ov:hover{background:var(--sunk)}
.ov b{font-variant-numeric:tabular-nums}
.ov span{font-size:12px;color:var(--muted)}
.ov.ans{background:var(--sel-soft);border-color:var(--sel)}
.ov .st{font-weight:700;font-size:12px;color:var(--ng)}
.ov.ans .st{color:var(--sel)}
.ov.flg::after{content:"見直し";position:absolute;top:6px;right:8px;font-size:11px;font-weight:700;background:var(--accent);color:#1b1305;padding:0 6px;border-radius:2px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.dialog{border:2px solid var(--accent);background:var(--accent-soft);border-radius:4px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}

/* ---------- speaking ---------- */
.spk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:16px;align-items:start}
@media (max-width:860px){.spk{grid-template-columns:1fr}}
.video{background:var(--vid);border-radius:4px;overflow:hidden;position:relative;aspect-ratio:4/3;max-width:100%}
.video svg{width:100%;height:100%;display:block}
.video .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(0,0,0,.55);color:#fff;font-family:var(--en);font-size:15px;padding:8px 12px;line-height:1.5}
.mouth{transform-origin:150px 128px;transform-box:view-box}
.talking .mouth{animation:talk .22s infinite alternate}
@keyframes talk{from{transform:scaleY(.3)}to{transform:scaleY(1.4)}}
.recbox{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:4px;padding:10px 14px;background:var(--sunk)}
.mic{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.mic svg{width:22px;height:22px}
.mic.on{background:var(--rec);border-color:var(--rec);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--rec-soft)}100%{box-shadow:0 0 0 12px transparent}}
.recbox .lbl{font-weight:700}
.recbox .lbl.on{color:var(--rec)}
.recbox .cd{margin-left:auto;font-size:30px;font-weight:700;font-variant-numeric:tabular-nums}
.bar-m{height:6px;background:var(--surface);border:1px solid var(--line);border-radius:3px;overflow:hidden}
.bar-m i{display:block;height:100%;width:0;background:var(--sel)}
.bar-m.on i{background:var(--rec)}
.qcard{border:2px solid var(--line2);background:var(--surface);padding:16px}
.qcard h3{font-family:var(--en);text-align:center;margin:0 0 6px;font-size:18px}
.qcard .back{display:grid;place-items:center;min-height:200px;color:var(--muted);font-size:14px;text-align:center}
svg.pic{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--ill-bg);margin-top:12px}
.pics{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-top:12px}
.pics.three{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pics figure{margin:0;display:flex;flex-direction:column;gap:4px;min-width:0}
.pics figcaption{font-weight:700;font-size:13px;font-family:var(--en)}
.pics svg{width:100%;height:auto;display:block;border:1px solid var(--line);background:var(--ill-bg)}
.opening{font-family:var(--en);border:1.5px solid var(--line2);padding:6px 10px;font-size:15px;margin-top:10px;line-height:1.6}
.script{font-family:var(--en);font-size:15px;background:var(--sunk);border:1px dashed var(--line2);padding:8px 12px}

/* ---------- listening ---------- */
.lstage{display:flex;align-items:center;gap:14px;border:1px solid var(--line);background:var(--sunk);border-radius:4px;padding:12px 14px;flex-wrap:wrap}
.spk-ic{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line2);color:var(--muted)}
.spk-ic.on{border-color:var(--sel);color:var(--sel)}
.spk-ic svg{width:20px;height:20px}
.lstage .lbl{font-weight:700}
.lstage .bar-m{flex:1;min-width:120px}

/* ---------- writing ---------- */
textarea{font-family:var(--en);font-size:16px;line-height:1.7;width:100%;min-height:220px;padding:12px;border:1px solid var(--line2);border-radius:2px;background:var(--surface);color:var(--ink);resize:vertical}
.wc{font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.wc b{color:var(--ink)}
.u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1.5px}
.points{font-family:var(--en);font-size:15px;border-top:1px solid var(--line);margin-top:8px;padding-top:6px}

/* ---------- results ---------- */
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.sum div{background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:12px;min-width:0}
.sum b{display:block;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.sum b.na{font-size:16px;color:var(--muted);padding-top:6px}
.sum span{font-size:12px;color:var(--muted)}
.stopped{display:inline-block;font-size:12px;font-weight:700;color:var(--ng);background:var(--ng-soft);border-radius:3px;padding:1px 8px}
details{border:1px solid var(--line);border-radius:4px;background:var(--surface)}
details>summary{cursor:pointer;padding:12px 14px;font-weight:700;list-style:none;display:flex;justify-content:space-between;gap:8px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"＋";color:var(--muted)}
details[open]>summary::after{content:"－"}
.dbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:12px}
.rv{border-top:1px solid var(--line);padding-top:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;border-radius:3px}
.tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.ng{background:var(--ng-soft);color:var(--ng)}
.model{font-family:var(--en);background:var(--ok-soft);border-radius:3px;padding:8px 12px;font-size:15px}
.mine{font-family:var(--en);background:var(--sunk);border-radius:3px;padding:8px 12px;font-size:15px;white-space:pre-wrap;word-break:break-word}
.selfrate{display:flex;gap:6px;flex-wrap:wrap}
.selfrate button{font:inherit;font-size:13px;padding:5px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.selfrate button[aria-pressed="true"]{background:var(--sel);border-color:var(--sel);color:var(--surface)}
.ai{border:1px solid var(--sel);border-radius:4px;padding:12px 14px;background:var(--sel-soft);display:flex;flex-direction:column;gap:8px}
.ai table{border-collapse:collapse;font-size:14px}
.ai td{padding:3px 10px 3px 0;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){.talking .mouth,.mic.on{animation:none}}

.scopes .gbtn b{font-size:16px}
.cardno{font-size:12px;color:var(--muted);text-align:center;margin-bottom:2px}
.cardimg{width:100%;height:auto;display:block;border:1px solid var(--line);margin-top:12px;background:#fff}
.pics img{width:100%;height:auto;display:block;border:1px solid var(--line);background:#fff}
.lpic{max-width:min(380px,100%);height:auto;border:1px solid var(--line);background:#fff;display:block}
.pnotes{font-size:13px;color:var(--muted);margin-top:8px}
.btn.sm{min-height:34px;padding:4px 12px;font-size:13px}
.btn.playing{background:var(--sel-soft);border-color:var(--sel)}
.ca{font-weight:700;color:var(--ok)}
small.bp{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;color:var(--muted);margin-top:4px}
details.inner{margin-top:6px}

</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="bar1 gut"><div class="in">
      <span class="lv" id="lv">3級</span>
      <span class="sec" id="secname">英検S-CBT 模擬試験（過去問）</span>
      <span class="who" id="who"></span>
      <div class="tbox" id="tbox" hidden><small id="tlabel">残り時間</small><b id="tval">0:00</b></div>
      <button class="abort" id="abortBtn" hidden>中止</button>
    </div></div>

 "2": "次の会話について、(　　)に入れるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "3A": "次の掲示の内容に関して、質問に対する答えとして最も適切なもの、または文を完成させるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "3B": "次のEメールの内容に関して、質問に対する答えとして最も適切なもの、または文を完成させるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "3C": "次の英文の内容に関して、質問に対する答えとして最も適切なもの、または文を完成させるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。"}, "pas": {"notice": {"title": "This Saturday's Basketball Game", "body": "Brownsville Junior High School's basketball team will have a big game this weekend. We want all students to come!<br><br><b>Place:</b> Springfield Junior High School's gym<br>Please ask your parents to take you to Springfield Junior High School. It's far away, so they will have to drive there. They can put their car in the parking lot near the school. Then you have to walk five minutes from there to the front gate.<br><br><b>Time:</b> 7:00 p.m.–8:30 p.m.<br>The game starts at 7:00 p.m., but please arrive before 6:30 p.m. The doors of the school will be closed until 6:00 p.m.<br><br>Let's have fun!"}, "mail": {"head": "From: Kathy Ramirez<br>To: Alison Ramirez<br>Date: April 3<br>Subject: Party for Mark", "body": "Hey Alison,<br>Guess what? Mark is going to go to Hillside University to study for four years! I can't believe our younger brother will go to such a good university. I was so surprised when I heard that news, but I know he studied hard and did well in high school. He says he's going to study science. I'm planning a party for him this Saturday at Mom and Dad's house. I'll ask some of his friends to come, too. Can you help me to get ready for the party? It'll start at 4:00 p.m., so I want you to arrive by 3:00 p.m. to clean our parents' house with me. Of course, Mom and Dad will help, too. Also, could you make curry and rice and bring it to the party? It's Mark's favorite food, and he thinks your cooking is delicious.<br>Your sister,<br>Kathy", "head2": "From: Alison Ramirez<br>To: Kathy Ramirez<br>Date: April 3<br>Subject: Great news!", "body2": "Hi Kathy,<br>That's great news! I can't believe Mark will go to university soon! He really wanted to go to a good university, so I'm sure he is very happy. I can help you to prepare for the party on Saturday. I have a singing lesson from 10:00 a.m. until 11:30 a.m. After that, I'll go to the supermarket and buy meat and vegetables, and then I'll make curry and rice at my house. I'll arrive at Mom and Dad's house at 2:30 p.m. Then I can help you to clean the house.<br>See you on Saturday,<br>Alison"}, "saffron": {"title": "Saffron", "body": "Saffron is a spice* that is used for cooking in many countries around the world. It is made from small parts of a flower called a crocus. These parts are red, but food cooked with saffron is yellow. Many people think the taste is strong and delicious. Saffron is used to cook many kinds of food, such as rice, meat, and soup.<br><br>People in parts of Asia have used saffron when they cook for a long time. It has also been popular for hundreds of years in parts of southern Europe. Later, people in other places started using it, too. Many people used saffron for cooking, but some people used it for other things. It was given to sick people to help them to feel better, and people also used it to dye* clothes.<br><br>Making saffron isn't easy. Usually, more than 150 crocus flowers must be collected to make one gram* of saffron. The flowers only grow for a few months in fall and winter. The flowers are weak, so people have to collect them with their hands. This takes a long time, so many people are needed to collect them. Also, the flowers should be collected early in the morning before the sun damages* them.<br><br>For these reasons, saffron is expensive. It is the most expensive spice in the world. In the past, it was more expensive than gold. However, people don't need to use much of it when they cook because of its strong taste. Because of that, many people still buy saffron to use at home.", "notes": "*spice：香辛料　*dye：～を染める　*gram：グラム　*damage：～を傷める"}}, "read": [{"p": 1 is famous for flowers."], "ans": 2}], "write": [{"label": "Eメール", "min": 15, "max": 25, "note": "2024年度から加わった形式です（英検協会が公表した出題例）。", "instr": "あなたは、外国人の友達（James）から以下のEメールを受け取りました。Eメールを読み、それに対する返信メールを英文で書きなさい。あなたが書く返信メールの中で、友達（James）からの2つの質問（下線部）に対応する内容を、あなた自身で自由に考えて答えなさい。語数の目安は15語～25語です。解答欄の外に書かれたものは採点されません。解答が友達（James）のEメールに対応していないと判断された場合は、0点と採点されることがあります。", "prompt": "Hi,<br><br>Thank you for your e-mail.<br>I heard that you went to your friend's birthday party. I want to know more about it. <span class=\"u\">How many people were at the party?</span> And <span class=\"u\">how was the food?</span><br><br>Your friend,<br>James", "plain": "Hi, Thank you for your e-mail. I heard that you went to your friend's birthday party. I want to know more about it. How many people were at the party? And how was the food? Your friend, James", "before": "Hi, James!<br>Thank you for your e-mail.", "after": "Best wishes,", "model": "At the party, there were five people, and the food was great. We enjoyed eating sushi and the birthday cake."}, {"label": "英作文", "min": 25, "max": 35, "instr": "あなたは、外国人の友達から以下のQUESTIONをされました。QUESTIONについて、あなたの考えとその理由を2つ英文で書きなさい。語数の目安は25語～35語です。解答欄の外に書かれたものは採点されません。解答がQUESTIONに対応していないと判断された場合は、0点と採点されることがあります。QUESTIONをよく読んでから答えてください。", "prompt": "<b>QUESTION</b><br>Do you want to work in a foreign country in the future?", "plain": "QUESTION: Do you want to work in a foreign country in the future?", "model": "Yes, I do. First, I want to work with foreign people and learn about their cultures. Second, my dream is to work for a famous fashion company in Europe."}]}, "p2": {"key": "p2", "label": "準2級", "title": "2025年度 第2回", "src": "英検準2級過去問集 2026年度版（旺文社）", "base": "英検準2級/英検準2級過去問集 2026年度版/2025年度 第2回/音源", "audience": "日本人の高校生", "rubric": "Eメール問題の観点: 内容(下線部について特徴を問う具体的な質問を2つし、相手の質問に答えているか)・語彙・文法 各0-4点。\n英作文(意見論述・理由2つ)の観点: 内容・構成・語彙・文法 各0-4点。", "writeDesc": "ライティングはEメール（40〜50語）と英作文（50〜60語）の2問です。", "times": {"rw": 80, "r": 50, "w": 30}, "speak": {"card": "A", "tit et, they <span class=\"blank\">(22)</span>. They had not seen each other for a long time but did not feel uncomfortable at all. This experience made her realize that her childhood friends were a big part of her life. She also learned that she should care more about her old friends."}, "tennis": {"head": "From: Victoria Hill &lt;info@grand-tennis.com&gt;<br>To: Jake Adams &lt;j.adams-123@network-globally.com&gt;<br>Date: April 28<br>Subject: Important information about the tennis tournament", "body": "Dear Jake,<br><br>This is Victoria Hill. We are glad to hear that your team will join us again for our next tennis tournament on May 5. This will be our fifth tournament. We are very surprised and excited because we have never had so many teams in a tournament before. This time, we have planned matches not only for men's and women's teams but also for mixed teams.<br><br>There is one thing we are sorry to tell you. We see that you want to play in the B-level group. We believe your skills are perfect for that level, too. However, you cannot play in the B-level group. Many teams have asked to play in this group, although we only have ten spots. Because you applied a little late, there are no more spots left. Therefore, we want to suggest that you play at a higher level, the A-level group. We understand it will be tough, but we believe you can try. Also, you have a choice to move to the C-level group or wait for a team in the B-level group to cancel. However, we encourage you to take part in the A-level group. Otherwise, we will pay you back your tournament fee right away.<br><br>Thank you,<br>Victoria Hill"}, "salt": {"title": "Salt", "body": "Salt is necessary for humans to survive. It is a common item widely available today. Because it gives extra flavor to meals, it may be simply considered an item used for cooking. However, it is not only used to add flavor. Salt was seen very differently in the past. With many historical factors, salt was important in many ways in various cultures around the world.<br><br>In the past, people all over the world wanted salt for a variety of reasons. For example, people used salt when there were no refrigerators. This was because it could help food last longer. Salt was also useful in the field of medicine. Past records show that it was used to treat both humans and animals. People relied on salt as a medicine to improve their health conditions and to treat animals' injuries.<br><br>History shows that salt was often linked to money and the economy. For example, according to some records, salt was so valuable that it was used as money. In Europe, salt helped some cities grow their economies. Even new cities and roads were built to produce and deliver salt. Moreover, a lot of wars happened over salt around the world. It shows how much salt meant to people throughout history.<br><br>It is clear that salt has had a huge impact on people. Nowadays, salt is still used in cooking and medicine. In addition, salt is found in other situations. It is a great cleaner for polishing metal items. It is also helpful to melt snow on the road on snowy days and to prevent the roads from freezing. For these reasons, salt will probably continue to influence people's lives in the future."}}, "read": [{"p": 1, "q": "After working as a reporter for a newspaper for several years, Angela became its (　　). It is her job to decide which news stories will appear in the newspaper.", "o": ["architect", "engineer", "editor", "astronaut"], "ans": 2}, {"p": 1, "q": "A: I'm looking for ideas for this year's company trip. Does anyone have any (　　)?<br>B: We could go hiking around Tindall Lake. It's really pretty there at this time of year.", "o": ["figures", "characters", "puzzles", "suggestions"], "ans": 3}, {"p": 1, "q": "A: Mom, can we make some cookies today?<br>B: No. We don't have all the (　　). There aren't any eggs or sugar.", "o": ["explosions", "ingredients", "participants", "forecasts"], "ans": 1}, {"p": 1, "q": "The ship's captain (　　) dived into the sea and swam to the little girl who had fallen into the water.", "o": ["unfortunately", "awfully", "bravely", "hardly"], "ans": 2}, {"p": 1, "q": "A: Charlie, the soup is ready. Could you put those (　　) on the counter?<br>B: Sure, Mom.", "o": ["bowls", "ropes", "logs", "rays"], "ans": 0}, {"p": 1, "q": "Judy has a (　　) problem. She is getting married next week, but her dog tried to eat her wedding dress and destroyed it.", "o": ["curly", "serious", "steady", "careful"], "ans": 1}, {"p": 1, "q": "After graduating from college, Terry moved to Boston to (　　) his marketing company there. He thought the city would be a good place to start a business.", "o": ["blush", "base", "bend", "broadcast"], "ans": 1}, {"p": 1, "q": "Lisa tried to remember the man's name, but her mind completely (　　). As a result, she struggled to continue the conversation naturally.", "o": ["collected", "hurt", "blanked", "waved"], "ans": 2}, {"p": 1, "q": "A: Have you finished writing your postcards to your friends?<br>B: Yes. I'm going to (　　) them on my way to school tomorrow.", "o": ["stand", "steam", "mail", "float"], "ans": 2}, {"p": 1, "q": "A: What are you doing with that old tennis ball, honey?<br>B: I'm going to (　　) it against the garage wall and catch it. It was fun when I was a kid.", "o": ["feed", "share", "chew", "bounce"], "ans": 3}, {"p": 1, "q": "(　　) her full-time job, Sheila teaches guitar lessons on the weekends. She is always so busy.", "o": ["On account of", "For fear of", "In addition to", "By means of"], "ans": 2}, {"p": 1, "q": "A: I have a history test tomorrow, and I'm really worried.<br>B: Just (　　). You've studied hard, so you should be ready for it.", "o": ["see it off", "learn by heart", "come of age", "take it easy"], "ans": 3}, {"p": 1, "q": "The students had a meeting to prepare for their class party. They discussed what foods to bring, which games to play, (　　).", "o": ["by all means", "in no time", "out of date", "and so on"], "ans": 3}, {"p": 1, "q": "A: Did your mom help you make this cake, Jenny?<br>B: No. No one helped me. I made it (　　).", "o": ["on my own", "for good", "from day to day", "in a word"], "ans": 0}, {"p": 1, "q": "A: I saw you running in the park yesterday. Do you like to run?<br>B: Yes. It's a good way to keep (　　).", "o": ["on your side", "in good shape", "at the front", "with any luck"], "ans": 1}, {"p": 2, "q": "<i>A:</i> Welcome to Jason's PC Rescue. How can I assist you today?<br><i>B:</i> Hi, I accidentally dropped my computer from my desk. I can turn it on, but the top half of the screen is completely dark.<br><i>A:</i> I understand. I'll (　16　) and check if everything else works well.<br><i>B:</i> Thank you. I really hope that's the only part that's damaged.", "o": ["fix your desk as soon as possible", "make sure the screen is dark enough", "change the screen to a new one", "return it to you without any repairs"], "ans": 2}, {"p": 2, "q": "<i>A:</i> Jason, how should we get to the hotel from here?<br><i>B:</i> Let me check the guidebook. It says we can either take the bus or the train.<br><i>A:</i> We've got heavy bags, so I'd prefer not to walk too much.<br><i>B:</i> In that case, (　17　). It drops us off right in front of the hotel.", "o": ["we should take the bus", "we can walk to our hotel", "let's book a guided tour later", "let's check in our baggage first"], "ans": 0}, {"p": 2, "q": "<i>A:</i> Hello. What can I get for you today?<br><i>B:</i> Hi. I'd like four beef tacos and a large chicken salad to go, please.<br><i>A:</i> Sure. For your salad, we have a creamy dressing or a spicy dressing. Which one would you like?<br><i>B:</i> I don't want my salad to be too hot, so I'll have (　18　), please.", "o": ["another cup of tea", "the creamy one", "two more tacos", "something spicy"], "ans": 1}, {"p": 2, "pas": "party", "blank": 19, "o": ["don't like parties", "don't eat meat or fish", "like to go fishing", "like to eat out"], "ans": 1}, {"p": 2, "pas": "party", "blank": 20, "o": ["are expecting a poor harvest this year", "are working at the farms nearby", "can buy directly from the producers", "can learn how to make sushi rolls"], "ans": 2}, {"p": 3, "pas": "ruby", "blank": 21, "o": ["When her college called her", "While she was there", "When her family visited her", "When she was in New York"], "ans": 1}, {"p": 3, "pas": "ruby", "blank": 22, "o": ["had a great time together", "learned making new friends was great", "felt sorry about each other's pets", "found it hard to have conversations"], "ans": 0}, {"p": "4A", "pas": "tennis", "q": "What is true about the tennis tournament on May 5?", "o": ["Victoria Hill expected more teams to apply.", "It includes only mixed teams of men and women.", "It is the first tournament Jake Adams will play in.", "More teams are attending than ever before."], "ans": 3}, {"p": "4A", "pas": "tennis", "q": "Jake's team cannot play in the B-level group because", "o": ["the spots for the group have been filled.", "not enough teams applied for the group.", "his team's skills are too high for the level.", "his team is not allowed to play at the event."], "ans": 0}, {"p": "4A", "pas": "tennis", "q": "What is one thing that Victoria advised Jake to do?", "o": ["Give up playing in the C-level group.", "Take part in the A-level group.", "Pay more for the tournament.", "Join the other team in the B-level group."], "ans": 1}, {"p": "4B", "pas": "salt", "q": "What did people think about salt in the past?", "o": ["It was an item that was easily available anywhere.", "It was one of the best discoveries in the cooking world.", "It had other purposes than adding flavor to meals.", "It had various tastes when it was cooked differently."], "ans": 2}, {"p": "4B", "pas": "salt", "q": "People in the past used salt as", "o": ["an item to keep people from catching a cold.", "a poison to kill dangerous animals.", "a medicine to treat injured animals.", "a product to wash people's hair."], "ans": 2}, {"p": "4B", "pas": "salt", "q": "What is true about the impact of salt in the past?", "o": ["Salt was offered to end war everywhere around the world.", "Money became useless because it was replaced with salt.", "Roads were created by rich salt producers.", "New cities and roads were built to make or carry salt."], "ans": 3}, {"p": "4B", "pas": "salt", "q": "How does salt help people's lives today?", "o": ["It is used in beauty products to make people's skin smooth.", "It can be used as an item to clean things with.", "It helps people stay warm on snowy days.", "It helps to cool down people's bodies when they are sick."], "ans": 1}], "write": [{"label": "Eメール", "min": 40, "max": 50, "instr": "あなたは、外国人の知り合い（Alex）から以下のEメールを受け取りました。Eメールを読み、それに対する返信メールを英文で書きなさい。あなたが書く返信メールの中で、Alexのメール文中の下線部について、あなたがより理解を深めるために、下線部の特徴を問う具体的な質問を2つしなさい。また、Alexからの質問にも答えなさい。語数の目安は40語～50語です。解答欄の外に書かれたものは採点されません。解答がAlexのEメールに対応していないと判断された場合は、0点と採点されることがあります。", "prompt": "Hi!<br>I went to <span class=\"u\">a sports center</span> near the city hall during summer vacation. The sports center opened last year and has three floors. It costs 500 yen per person for 2 hours. While I was there, I saw a notice. A warm water pool will open next week, and visitors can swim even in winter. Do you think the number of such pools will increase in the future?<br>Your friend,<br>Alex", "plain": "Hi! I went to a sports center (underlined) near the city hall during summer vacation. The sports center opened last year and has three floors. It costs 500 yen per person for 2 hours. While I was there, I saw a notice. A warm water pool will open next week, and visitors can swim even in winter. Do you think the number of such pools will increase in the future? Your friend, Alex", "before": "Hi, Alex!<br>Thank you for your e-mail.", "after": "Best wishes,", "model": "I think the number of warm water pools will increase in the future. Swimming is good for staying healthy, so many people want to use the pool when it is cold outside. I have two questions. Can high school students use the sports center? What is its name?"}, {"label": "英作文", "min": 50, "max": 60, "instr": "あなたは、外国人の知り合いから以下のQUESTIONをされました。QUESTIONについて、あなたの意見とその理由を2つ英文で書きなさい。語数の目安は50語～60語です。解答欄の外に書かれたものは採点されません。解答がQUESTIONに対応していないと判断された場合は、0点と採点されることがあります。QUESTIONをよく読んでから答えてください。", "prompt": "<b>QUESTION</b><br>Do you think it is a good idea for people to take notes on their smartphones?", "plain": "QUESTION: Do you think it is a good idea for people to take notes on their smartphones?", "model": "Yes, I think taking notes on smartphones is a good idea. I have two reasons. First, it makes information easy to use. People can quickly edit, search, and review their notes. Second, taking notes on smartphones can reduce paper use. Notebooks do not need to be used, so the amount of paper used in daily life is decreased."}]}, "2": {"key": "2", "label": "2級", "title": "2025年度 第2回", "src": "英検2級過去問集 2026年度版（旺文社）", "base": "英検2級/英検2級過去問集 2026年度版/2025年度 第2回/音源", "audience": "日本人の高校生", "rubric": "要約問題の観点: 内容(本文の要点を過不足なく含み、自分の意見を加えていないか)・構成・語彙(本文の表現を言い換えているか)・文法 各0-4点。\n英作文(意見論述・理由2つ)の観点: 内容・構成・語彙・文法 各0-4点。", "writeDesc": "ライティングは要約（45〜55語）と英作文（80〜100語）の2問です。", "times": {"rw": 85, "r": 50, "w": 35}, "speak": {"card": "A", "title": "A New Way of Traveling", "passage": "Trains are an important method of getting around for people. Now, progress in the technology of trains that float on the tracks with powerful magnets makes engineers excited about the future of transportation. Passengers will make use of such trains, and by doing so they will travel faster and quieter than in the past. Engineers hope to bring this technology to practical use.", "opening": "One day, Mr. and Mrs. Sasaki were talking about their plans for Christmas.", "imgs": [["", "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/wAALCAFXBLABAREA/8QAGwAAAQUBAQAAAAAAAAAAAAAAAQACAwQFBgf/xABVEAABAwIEAwQGB ade a strange noise when starting.", "Its seat was not comfortable."]}, {"part": 2, "f": "28_No26.mp3", "ans": 1, "a0": 37.2, "a1": 46.84, "read": false, "opts": ["Play with a different soccer team.", "Win a game against another school.", "Practice with his team on weekends.", "Play a game with his friends."]}, {"part": 2, "f": "29_No27.mp3", "ans": 1, "a0": 41.03, "a1": 50.68, "read": false, "opts": ["It was mistaken for a Dutch word.", "It was originally next to a wall.", "It was named after a town in Holland.", "It was built by the Wall family."]}, {"part": 2, "f": "30_No28.mp3", "ans": 3, "a0": 40.13, "a1": 49.76, "read": false, "opts": ["A train with only standard-class cars.", "A train that will depart in ten minutes.", "A train that is boarding at Platform 1.", "An express train to Hargate."]}, {"part": 2, "f": "31_No29.mp3", "ans": 3, "a0": 36.57, "a1": 46.18, "read": false, "opts": ["The plane has not yet arrived.", "There are not enough snacks for passengers.", "The flight will not leave from Paris.", "The weather in Paris is not safe."]}, {"part": 2, "f": "32_No30.mp3", "ans": 3, "a0": 36.74, "a1": 46.85, "read": false, "opts": ["Use their mobile phones.", "Collect all of their bags.", "Confirm their baggage area.", "Put their seats upright."]}], "listen_parts": {"1": {"expl": "01_Part1_explanation.mp3", "dir": "対話を聞き、その質問に対して最も適切なものを1, 2, 3, 4の中から一つ選びなさい。（英文は一度だけ放送されます）"}, "2": {"expl": "17_Part2_explanation.mp3", "dir": "英文を聞き、その質問に対して最も適切なものを1, 2, 3, 4の中から一つ選びなさい。（英文は一度だけ放送されます）"}}, "rdir": {"1": "次の(　　)に入れるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "2A": "次の英文を読み、その文意にそって(　　)に入れるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "2B": "次の英文を読み、その文意にそって(　　)に入れるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "3A": "次のEメールの内容に関して、質問に対して最も適切なもの、または文を完成させるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。", "3B": "次の英文の内容に関して、質問に対して最も適切なもの、または文を完成させるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。"}, "pas": {"slinky": {"title": "A Toy Made from a Spring", "body": "There are many inventions in the world, and they have made our lives richer and more interesting. Thomas Edison repeated experiments and finally achieved his original goal of inventing the light bulb. Some inventions, like Edison's light bulb, are the result of the inventor's desire to create them from the beginning. <span class=\"blank\">(18)</span>, there are other types of inventions that were created by chance. A toy called the Slinky is one of them.<br><br>Richard James was an engineer working for the United States Navy. He was given the task of coming up with an idea to protect expensive instruments on the ship during the rough ocean travel. One day, while he was dealing with a spring, he <span class=\"blank\">(19)</span> from a shelf. Instead of falling where he thought it would, it moved along the shelf. It looked as if it was walking down the stairs. He let the spring fall to the floor again and again to check that it moved like a living thing each time.<br><br>After showing his wife his interesting discovery, he decided to develop it into a toy. She thought about the name that would suit the toy. She looked up some words in the dictionary and chose the word slinky. She chose the name because it meant \"elegant and smooth movement.\" When James tried to demonstrate and sell it at a department store, he was worried. He thought that <span class=\"blank\">(20)</span>. However, when he arrived, many shoppers were there to buy the toy. Ever since then, the Slinky has been enjoyed by many children around the world."}, "owls": {"title": "Learning from Owls", "body": "Owls are active at night because darkness works to their advantage. They have large eyes to gather as much light as possible. This helps them spot animals in the dark. What helps them find animals in the dark is not only their eyes but also their ears. Their ears are located at different heights on the left and right sides of their heads. This makes the time at which <span class=\"blank\">(21)</span> different. They analyze this difference instantly and determine the accurate position of the animals.<br><br>Spotting food is only the first step when animals hunt for their food. The hunters must get closer and catch their food before being noticed. Owls are also good at this. Many birds tend to make noise when cutting through the wind because air moves through their feathers in uncontrolled ways. However, the edges of owl feathers are unique. The special design helps create <span class=\"blank\">(22)</span>. This allows them to fly quietly and long distances without being noticed.<br><br>Some researchers are considering using the owl's feather structure in airplane design. A team at the University of London made a copy of owl feathers with 3D printing. They created model airplane wings with a structure similar to that of owl feathers and studied how air flowed around them. The research could help reduce noise from airplanes. This is very important for people in areas near airports, where more flights have caused higher noise levels. <span class=\"blank\">(23)</span>, many people hope for progress in this technology."}, "course": {"head": "From: Sarah Freeman &lt;sfreeman@careerdevelopment.com&gt;<br>To: All Course Participants &lt;participants@careerdevelopment.com&gt;<br>Date: March 23<br>Subject: Important course information", "body": "Dear marketing course participants,<br><br>Thank you for applying for the marketing course. Before your first lesson, we'd like to give you some essential information. In the first session, we'll talk about today's marketing needs. To help you understand, please watch a fifteen-minute video of basic concepts and practical examples before the first class on April 6. After watching it, there will be a short quiz to test your understanding.<br><br>We will have lessons every Tuesday and Thursday in April and May at 7 p.m. However, there will be a slight change in the schedule because the instructor of this course will be away for one week to attend an international conference. So, two classes for that week will be held in June. Due to this change, the course will end on June 6.<br><br>If you miss a lesson, we offer a way to catch up. We'll post videos of each lecture on the web. However, we allow you to take this offer only twice during the course period because discussing the materials with your classmates is an important part of this class. When you miss three sessions or more, please talk to your manager. We look forward to seeing you soon!<br><br>Best regards,<br>Sarah Freeman<br>Marketing Course Administration"}, "mirror": {"title": "The Mirror Test", "body": "Humans and animals are different in many ways. Some say only humans can have a language and a culture. Among these discussions, one idea that is often discussed is whether only humans can recognize or tell the difference between themselves and others. The mirror test is used to judge this. It is done by putting a mark on an animal's body. The mark is put in a place where the animal cannot see without the help of a mirror. If the animal tries to remove the mark on its body, it shows that the animal recognizes itself.<br><br>The same test was done on fish called cleaner wrasses in a tank with a mirror. At first, they attacked their reflection. This could be because they thought the reflection was another fish. Later, they changed how they swam and checked if the fish in the mirror also changed how they swam. After they got used to the mirror, they were put to sleep, and a mark was put on them. When they woke up and looked in the mirror, many of them tried to take the mark off their body. They did so by brushing their body against the tank or the sand on the bottom.<br><br>They also recognized themselves in photographs. In a test done after the mirror test, researchers showed the fish some pictures. When they were shown a picture of themselves with a mark on their body, they tried to remove the mark from their body. However, they did not act the same way when pictures of other fish with a mark were shown. This suggests that they recognize differences between themselves and other fish.<br><br>The mirror test has led to much discussion and debate. First, animals that have not seen a mirror before might not understand that what is in the mirror is themselves. It does not suggest that they do not recognize themselves. Instead, it shows that they have no idea how a mirror works. Moreover, vision is not the main sense for all animals. Some animals rely more on smell than vision, so failing the mirror test does not always mean they cannot recognize themselves."}}, "read": [{"p": 1, "q": "When King Otto died, his son was still too young to (　　) the kingdom. King Otto's brother looked after the country until the young prince was old enough to rule.", "o": ["overlap", "govern", "forgive", "arrest"], "ans": 1}, {"p": 1, "q": "The IT company has greatly (　　) since it opened five years ago. It now has offices in over 30 cities.", "o": ["suffered", "reflected", "expanded", "influenced"], "ans": 2}, {"p": 1, "q": "Because Westbrook Junior High School's softball team won the state championship, they have (　　) for next month's national finals.", "o": ["robbed", "qualified", "weighed", "disappeared"], "ans": 1}, {"p": 1, "q": "After working as a taxi driver for more than 10 years, Sue has decided to try a new (　　). She is now training to become a nurse.", "o": ["device", "complaint", "occupation", "proverb"], "ans": 2}, {"p": 1, "q": "Matthew's story (　　) his friends' attention completely. They hardly noticed how much time had passed while he was telling it.", "o": ["accepted", "flattened", "gripped", "promised"], "ans": 2}, {"p": 1, "q": "The politician's view on education was (　　) through his whole career. He never changed his opinion that teachers should be paid more.", "o": ["massive", "internal", "consistent", "recent"], "ans": 2}, {"p": 1, "q": "A: How was your math test today, James?<br>B: I did (　　) well. I wasn't expecting to pass, but I ended up getting 82 percent.", hat is one thing Sarah says about catching up with a class?", "o": ["Participants can talk with the instructor online.", "Participants can take lessons from different marketing courses.", "Participants can receive class materials by e-mail.", "Participants can watch videos of two classes online."], "ans": 3}, {"p": "3B", "pas": "mirror", "q": "The mirror test is used", "o": ["to test an animal's ability to see in the dark.", "to find out how far an animal can see outside.", "to determine if an animal can recognize itself.", "to see when a baby recognizes who its mother is."], "ans": 2}, {"p": "3B", "pas": "mirror", "q": "How did the cleaner wrasses check if the fish in the mirror was themselves?", "o": ["They opened and closed their mouths many times.", "They compared the color of their body to that of the mirrored fish.", "They tried to touch the fish in the mirror with their fins.", "They began to swim in a different way than before."], "ans": 3}, {"p": "3B", "pas": "mirror", "q": "What behavior did the cleaner wrasses take when they were shown a picture of themselves with a mark?", "o": ["They tried to get rid of the mark on their body.", "They escaped from the picture and hid behind a rock.", "They ignored the picture and showed no interest in it.", "They began swimming with other fish in the tank."], "ans": 0}, {"p": "3B", "pas": "mirror", "q": "In the discussion about the mirror test, it has been pointed out that", "o": ["it costs a lot of money and takes too much time.", "it is too dangerous to use a piece of glass in the water.", "it only works on fish and some types of monkeys.", "it needs to consider the other senses that animals have."], "ans": 3}, {"p": "3B", "pas": "mirror", "q": "Which of the following statements is true?", "o": ["Some fish can understand the difference between themselves and others.", "The cleaner wrasses were marked first and then placed in a tank with a mirror.", "The cleaner wrasses did not notice the marks that were put on their bodies.", "It was found that animals with large brains understood how to use mirrors."], "ans": 0}], "write": [{"label": "要約", "min": 45, "max": 55, "instr": "以下の英文を読んで、その内容を英語で要約し、解答欄に記入しなさい。語数の目安は45語～55語です。解答欄の外に書かれたものは採点されません。解答が英文の要約になっていないと判断された場合は、0点と採点されることがあります。英文をよく読んでから答えてください。", "prompt": "Nowadays, consumers have become increasingly concerned about various environmental issues across different industries. Within these trends, reducing wrapping materials has attracted particular attention. Recently, more businesses have begun adopting this policy.<br><br>What are the benefits of this? Reducing wrapping materials significantly lowers the overall environmental impact. Fewer wrapping materials mean less waste is created and fewer natural resources are consumed. Additionally, decreasing wrapping materials can ease the financial burden on producers. It leads to lower production costs and allows companies to offer their products at more reasonable prices to consumers.<br><br>However, reducing wrapping materials does have some drawbacks. Products could suffer quality issues because wrapping materials help protect them from damage during transportation. Moreover, reducing the amount of wrapping paper may result in consumers having to pay for wrapping when buying gifts and other items. Thus, some people find this annoying and inconvenient.", "plain": "Nowadays, consumers have become increasingly concerned about various environmental issues across different industries. Within these trends, reducing wrapping materials has attracted particular attention. Recently, more businesses have begun adopting this policy. What are the benefits of this? Reducing wrapping materials significantly lowers the overall environmental impact. Fewer wrapping materials mean less waste is created and fewer natural resources are consumed. Additionally, decreasing wrapping materials can ease the financial burden on producers. It leads to lower production costs and allows companies to offer their products at more reasonable prices to consumers. However, reducing wrapping materials does have some drawbacks. Products could suffer quality issues because wrapping materials help protect them from damage during transportation. Moreover, reducing the amount of wrapping paper may result in consumers having to pay for wrapping when buying gifts and other items. Thus, some people find this annoying and inconvenient.", "model": "More businesses have begun adopting a policy to reduce wrapping materials. This approach helps lower the overall environmental impact and can ease the financial burden on producers. However, with reduced wrapping materials, products could suffer quality issues due to damage during transportation. Also, some people find having to pay for wrapping annoying and inconvenient."}, {"label": "英作文", "min": 80, "max": 100, "instr": "以下のTOPICについて、あなたの意見とその理由を2つ書きなさい。POINTSは理由を書く際の参考となる観点を示したものです。ただし、これら以外の観点から理由を書いてもかまいません。語数の目安は80語～100語です。解答欄の外に書かれたものは採点されません。解答がTOPICに示された問いの答えになっていない場合や、TOPICからずれていると判断された場合は、0点と採点されることがあります。TOPICの内容をよく読んでから答えてください。", "prompt": "<b>TOPIC</b><br>Some people say it is important to set clear goals when starting new activities. Do you think this is a good idea?<div class=\"points\"><b>POINTS</b><br>● Efficiency　● Flexibility　● Motivation</div>", "plain": "TOPIC: Some people say it is important to set clear goals when starting new activities. Do you think this is a good idea? POINTS: Efficiency / Flexibility / Motivation", "model": "I think this is a good idea. First, setting clear goals when starting new activities helps people use their time efficiently. When they know what they want to achieve, they can plan what to do and avoid wasting time. Second, clear goals make people stay motivated. This means they can keep working hard even when unexpected difficulties arise, because they know exactly what they are working toward. Therefore, I think it is a good idea to set clear goals when starting new activities."}]}};

<script>
/* ===================== 英検S-CBT 模擬試験（過去問・本番音源版） ===================== */
const EX=window.EXAMS; // 生成データ
const ORDER=["3","p2","2"];
const SECS_ALL=[["speak","スピーキング"],["listen","リスニング"],["rw","リーディング・ライティング"]];
const SCOPES=[["all","4技能すべて","本番と同じ流れ"],["speak","スピーキングだけ","面接形式"],["listen","リスニングだけ","本番音源"],["read","リーディングだけ","時間を計って解く"],["write","ライティングだけ","キーボード入力"]];
const S={grade:"3",scope:"all",mode:"full",screen:"home",sec:null,i:0,run:0,la:{},ra:{},rf:{},wf:{},wa:["",""],done:{},started:{},self:{},rep:{},name:"",vol:1,ov:false,cf:false,ai:null,end:0,paused:false,pauseAt:0,aborted:false,explDone:{}};
const G=()=>EX[S.grade];
const $=s=>document.querySelector(s);
const main=$("#main");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const wcount=t=>t.trim().split(/\s+/).filter(Boolean).length;
const fmt=s=>`${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,"0")}`;
const inS=k=>S.scope==="all"||S.scope===k;
const firstSec=()=>S.scope==="all"?"speak":(S.scope==="read"||S.scope==="write")?"rw":S.scope;
function secs(){
  const all=[["speak","スピーキング"],["listen","リスニング"],["rw",S.scope==="read"?"リーディング":S.scope==="write"?"ライティング":"リーディング・ライティング"]];
  if(S.scope==="all")return all;
  const k=S.scope==="read"||S.scope==="write"?"rw":S.scope;return all.filter(x=>x[0]===k);
}
const limitMin=()=>{const t=G().times;return S.scope==="read"?t.r:S.scope==="write"?t.w:t.rw};
const RW=()=>[...(S.scope!=="write"?G().read.map((_,k)=>({t:"r",k})):[]),...(S.scope!=="read"?G().write.map((_,k)=>({t:"w",k})):[])];
const src=f=>encodeURI(G().base+"/"+f);

/* ===================== 音源プレーヤー ===================== */
const AU=new Audio();AU.preload="auto";
let auTick=null;
function play(file,{from=0,onTime,onEnd,onErr}={}){
  stopAudio();
  AU.src=src(file);AU.volume=S.vol;
  AU.onended=()=>{clearInterval(auTick);onEnd&&onEnd()};
  AU.onerror=()=>{clearInterval(auTick);onErr&&onErr()};
  const p=AU.play();if(p&&p.catch)p.catch(e=>{if(e&&e.name==="NotAllowedError"){onErr&&onErr("blocked")}});
  try{AU.currentTime=from}catch(e){}
  auTick=setInterval(()=>onTime&&onTime(AU.currentTime||0),150);
}
function stopAudio(){clearInterval(auTick);AU.onended=null;AU.onerror=null;try{AU.pause()}catch(e){}}

/* ===================== タイマー ===================== */
let tick=null;
function startTimer(secs,expire,each){
  stopTimer();const end=Date.now()+secs*1000;let fired=false;
  const f=()=>{const left=Math.max(0,Math.ceil((end-Date.now())/1000));each&&each(left,secs);if(left<=0&&!fired){fired=true;stopTimer();expire&&expire()}};
  f();tick=setInterval(f,200);
}
function startClock(each){stopTimer();const st=Date.now()-(S.elapsed||0);const f=()=>{S.elapsed=Date.now()-st;each(Math.floor(S.elapsed/1000))};f();tick=setInterval(f,500)}
function stopTimer(){clearInterval(tick);tick=null}
function head(v,label){
  const b=$("#tbox");if(v==null){b.hidden=true;return}
  b.hidden=false;$("#tlabel").textContent=label||"残り時間";$("#tval").textContent=fmt(v);
  b.classList.toggle("warn",label==="残り時間"&&v<=300);
}
function hush(){S.run++;stopAudio();stopTimer()}

/* ===================== 枠 ===================== */
function chrome(){
  $("#lv").textContent=G().label;
  const audioScr=S.screen==="speak"||S.screen==="listen"||S.screen==="home";
  $("#rail").innerHTML=secs().map(([k,l])=>`<span class="${S.sec===k?"on":S.done[k]?"done":""}">${l}</span>`).join("")+
    (audioScr?`<label class="vol" for="vol">音量<input type="range" id="vol" min="0" max="1" step="0.05" value="${S.vol}"></label>`:"");
  const v=$("#vol");if(v)v.oninput=e=>{S.vol=+e.target.value;AU.volume=S.vol};
  $("#who").textContent=S.name?`受験者：${S.name}`:"";
  $("#secname").textContent=S.sec?secs().find(s=>s[0]===S.sec)[1]+"テスト":"英検S-CBT 模擬試験（過去問）";
  $("#abortBtn").hidden=!S.sec;
}
function tool(html){const t=$("#tool");if(!html){t.hidden=true;$("#mainwrap").classList.remove("hasfoot");return}t.hidden=false;$("#toolin").innerHTML=html;$("#mainwrap").classList.add("hasfoot")}
function go(screen,extra={}){hush();Object.assign(S,{screen,cf:false,ov:false},extra);if(["speak","listen","rw"].includes(screen))S.started[screen]=true;render();window.scrollTo(0,0)}
function render(){chrome();({home,intro,speak,listen,rw,result})[S.screen]()}
function resetAll(){Object.assign(S,{la:{},ra:{},rf:{},wf:{},wa:["",""],done:{},started:{},self:{},rep:{},ai:null,end:0,elapsed:0,aborted:false,paused:false,explDone:{}})}

/* ===================== 一時停止・中止 ===================== */
function pause(){
  if(S.paused||!S.sec)return;S.paused=true;S.pauseAt=Date.now();hush();
  const live=S.screen==="speak"||S.screen==="listen";
  $("#dlgP").innerHTML=(S.screen==="rw"?"制限時間は止まっています。":"")+(live?"再開すると、いまの問題の音声を最初から流し直します。":"")+"中止する場合は、ここまでの結果を見るか、トップに戻るかを選んでください。";
  $("#ovl").hidden=false;$("#dResume").focus();
}
function resume(){if(!S.paused)return;if(S.screen==="rw"&&S.end)S.end+=Date.now()-S.pauseAt;S.paused=false;$("#ovl").hidden=true;render()}
$("#abortBtn").onclick=pause;$("#dResume").onclick=resume;
$("#dResult").onclick=()=>{S.paused=false;$("#ovl").hidden=true;S.aborted=true;go("result")};
$("#dHome").onclick=()=>{S.paused=false;$("#ovl").hidden=true;resetAll();go("home")};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.paused)resume()});

/* ===================== ホーム ===================== */
let audioOK=null;
function checkAudio(){
  audioOK=null;const a=new Audio();a.preload="metadata";
  a.onloadedmetadata=()=>{audioOK=true;const m=$("#amsg");if(m)m.innerHTML="音源ファイルを読み込めました。"};
  a.onerror=()=>{audioOK=false;const m=$("#amsg");if(m)m.innerHTML=`<b style="color:var(--ng)">音源ファイルが見つかりません。</b>このHTMLファイルを「過去問」フォルダ（英検3級・英検準2級・英検2級のフォルダがある場所）に置いて開いてください。`};
  a.src=src(G().speak.model);
}
function home(){
  S.sec=null;head(null);tool(null);chrome();
  const g=G(),t=g.times;
  const timeSel=S.scope==="all"||S.scope==="read"||S.scope==="write";
  main.innerHTML=`<section class="panel stack">
    <h1>英検S-CBT 模擬試験（過去問・本番音源）</h1>
    <p>実際の過去問と本番の音源を使い、英検S-CBTと同じ画面の進み方で受験できます。4技能を通して受けるほか、技能ごとの練習もできます。</p>
    <div class="stack" style="gap:6px"><span class="muted" style="font-size:13px" id="glab">受験する級</span>
      <div class="grades" role="radiogroup" aria-labelledby="glab">${ORDER.map(k=>{const v=EX[k];return `<button class="gbtn" role="radio" aria-checked="${S.grade===k}" data-g="${k}"><b>${v.label}</b><span>${v.title}</span></button>`}).join("")}</div></div>
    <div class="stack" style="gap:6px"><span class="muted" style="font-size:13px" id="slab">受験する範囲</span>
      <div class="scopes" role="radiogroup" aria-labelledby="slab">${SCOPES.map(([k,l,d])=>`<button class="gbtn" role="radio" aria-checked="${S.scope===k}" data-s="${k}"><b>${l}</b><span>${d}</span></button>`).join("")}</div></div>
    <div class="flow" ${S.scope==="all"?"":"hidden"}>
      <div><i>1</i><b>スピーキング</b><span>問題カード${g.speak.card}。本番音源の指示で進行し、準備時間のあと録音が自動で始まります</span></div>
      <div><i>2</i><b>リスニング</b><span>全${g.listen.length}問。解答時間が終わると自動で次の問題へ。戻れません</span></div>
      <div><i>3</i><b>リーディング・ライティング</b><span>全${g.read.length+g.write.length}問。2つで1つの制限時間（${t.rw}分）</span></div>
    </div>
    <div class="grid2">
      <label class="f" for="nm">受験者名（任意）<input type="text" id="nm" value="${esc(S.name)}" autocomplete="off"></label>
      ${timeSel?`<label class="f" for="md">制限時間
        <select id="md"><option value="full"${S.mode==="full"?" selected":""}>本番と同じ：${limitMin()}分${S.scope==="all"?"":"（本番の配分の目安）"}</option><option value="free"${S.mode==="free"?" selected":""}>時間制限なし（経過時間を表示）</option></select></label>`:""}
    </div>
    <div class="stack" style="gap:8px" ${S.scope==="read"||S.scope==="write"?"hidden":""}><b>音量の確認</b>
      <div class="row"><button class="btn" id="check">テスト音声を再生</button><span class="muted" id="amsg" style="font-size:13px">確認中…</span></div></div>
    <p class="note">出典：${g.src}　${g.title}。${g.key==="3"?"3級のライティングは2024年度から加わったEメール問題（英検協会の公表例）を含めています。":""}</p>
    <p class="note" ${S.scope==="all"||S.scope==="speak"?"":"hidden"}>本番のスピーキングはマイクで録音されます。この模擬では録音しないので、マイクが赤くなっている間に声に出して答える練習をしてください。試験中は右上の「中止」でいつでも一時停止・中止できます。</p>
    <div class="row"><button class="btn primary" id="start">${g.label}${S.scope==="all"?"の試験":"・"+SCOPES.find(x=>x[0]===S.scope)[1]}を開始する</button></div>
  </section>`;
  main.querySelectorAll(".gbtn[data-g]").forEach(b=>b.onclick=()=>{S.grade=b.dataset.g;home()});
  main.querySelectorAll(".gbtn[data-s]").forEach(b=>b.onclick=()=>{S.scope=b.dataset.s;home()});
  $("#nm").oninput=e=>{S.name=e.target.value;chrome()};
  if($("#md"))$("#md").onchange=e=>S.mode=e.target.value;
  if($("#check"))$("#check").onclick=()=>{play(G().speak.model,{onTime:t=>{if(t>6)stopAudio()},onErr:()=>{$("#amsg").innerHTML=`<b style="color:var(--ng)">再生できませんでした。</b>音源フォルダの場所を確認してください。`}})};
  $("#start").onclick=()=>{stopAudio();resetAll();go("intro",{sec:firstSec()})};
  checkAudio();
}
